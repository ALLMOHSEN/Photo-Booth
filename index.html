<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>فوتو بوث الذكريات | Canon SELPHY</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Arabic Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* Strict Kiosk Viewport & Touch Lock */
    html, body, #app {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: 'Cairo', sans-serif;
      background-color: #050814;
      color: #f8fafc;
    }

    button, [role="button"] {
      touch-action: manipulation;
      cursor: pointer;
    }

    /* Blurred live camera background on home screen */
    .blurred-camera-bg {
      filter: blur(14px) brightness(0.74);
      transform: scale(1.08);
    }

    .blurred-camera-bg.mirrored {
      transform: scaleX(-1) scale(1.08);
    }

    /* Unblurred live camera feed during capture */
    .live-camera-feed {
      filter: blur(0px) brightness(1);
      transform: scale(1);
    }

    .live-camera-feed.mirrored {
      transform: scaleX(-1);
    }

    /* Gentle central button pulse */
    @keyframes capturePulse {
      0%, 100% {
        box-shadow: 0 0 36px rgba(99, 102, 241, 0.55), 0 0 72px rgba(236, 72, 153, 0.28);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 52px rgba(99, 102, 241, 0.8), 0 0 95px rgba(236, 72, 153, 0.45);
        transform: scale(1.02);
      }
    }

    .capture-btn-pulse {
      animation: capturePulse 2.8s infinite ease-in-out;
    }

    /* White camera flash animation */
    @keyframes flashBurst {
      0% { opacity: 0.96; }
      100% { opacity: 0; }
    }

    .flash-burst {
      animation: flashBurst 0.42s ease-out forwards;
    }

    /* Countdown number entrance */
    @keyframes countPop {
      0% { transform: scale(0.45); opacity: 0; }
      35% { transform: scale(1.12); opacity: 1; }
      85% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.85); opacity: 0; }
    }

    .count-pop {
      animation: countPop 0.92s ease-in-out forwards;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* Print-only container hidden during normal kiosk viewing */
    #printOnlyContainer {
      display: none;
    }

    /* Canon SELPHY 4x6 inch / 100mm x 148mm borderless print rules */
    @page {
      size: 4in 6in;
      margin: 0;
    }

    @media print {
      @page {
        size: 4in 6in;
        margin: 0 !important;
      }

      html, body, #app {
        width: 4in !important;
        height: 6in !important;
        min-height: 6in !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        background: #ffffff !important;
      }

      #app > *:not(#printOnlyContainer) {
        display: none !important;
      }

      #printOnlyContainer {
        display: block !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 4in !important;
        height: 6in !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        z-index: 999999 !important;
      }

      #printOnlyImg {
        width: 4in !important;
        height: 6in !important;
        max-width: none !important;
        max-height: none !important;
        object-fit: fill !important;
        display: block !important;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="relative w-full h-full overflow-hidden">

    <!-- Full-screen flash overlay on photo capture -->
    <div id="flashOverlay" class="fixed inset-0 bg-white pointer-events-none opacity-0 z-50"></div>

    <!-- Print-only full-bleed 4in x 6in (100mm x 148mm) output -->
    <div id="printOnlyContainer" aria-hidden="true">
      <img id="printOnlyImg" alt="Canon SELPHY 4x6 Print" />
    </div>

    <!-- ===================================================================== -->
    <!-- SCREEN 1: COMPLETELY CLEAN START SCREEN (ONLY BLURRED BG + 1 BUTTON)   -->
    <!-- ===================================================================== -->
    <section id="screenStart" class="relative w-full h-full flex items-center justify-center p-6 overflow-hidden">
      <!-- Blurred Camera Background (<video> with automatic fallback to smooth animated canvas) -->
      <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <video id="bgVideo" autoplay playsinline muted class="w-full h-full object-cover blurred-camera-bg mirrored hidden"></video>
        <canvas id="bgSimCanvas" width="1280" height="720" class="w-full h-full object-cover blurred-camera-bg"></canvas>
        <div class="fixed inset-0 bg-slate-950/35"></div>
      </div>

      <!-- Center Stack: 3/4 Shot Picker + Main Capture Button -->
      <div class="relative z-10 w-full max-w-md flex flex-col items-center justify-center gap-4">
        <!-- Simple 3-Shot / 4-Shot Picker with Miniature Strip Icons -->
        <div class="w-full grid grid-cols-2 gap-3 glass-panel p-2 rounded-3xl" role="group" aria-label="عدد الصور">
          <button
            id="btnShots3"
            type="button"
            data-shots="3"
            onclick="selectShotCount(3)"
            class="shot-count-btn py-2.5 px-3 rounded-2xl border-2 flex items-center justify-center gap-3 transition bg-indigo-600/45 border-amber-300 text-white shadow"
          >
            <svg class="w-5 h-7 shrink-0" viewBox="0 0 24 34" fill="none" aria-hidden="true">
              <rect x="2" y="2" width="20" height="30" rx="3.5" stroke="currentColor" stroke-width="2" />
              <rect x="5.5" y="5.5" width="13" height="6.2" rx="1.2" fill="currentColor" opacity="0.9" />
              <rect x="5.5" y="13.8" width="13" height="6.2" rx="1.2" fill="currentColor" opacity="0.9" />
              <rect x="5.5" y="22.1" width="13" height="6.2" rx="1.2" fill="currentColor" opacity="0.9" />
            </svg>
            <span class="text-base sm:text-lg font-black">3 صور</span>
          </button>

          <button
            id="btnShots4"
            type="button"
            data-shots="4"
            onclick="selectShotCount(4)"
            class="shot-count-btn py-2.5 px-3 rounded-2xl border-2 flex items-center justify-center gap-3 transition bg-slate-900/70 border-white/15 text-slate-200 hover:border-white/35"
          >
            <svg class="w-5 h-7 shrink-0" viewBox="0 0 24 34" fill="none" aria-hidden="true">
              <rect x="2" y="2" width="20" height="30" rx="3.5" stroke="currentColor" stroke-width="2" />
              <rect x="6" y="4.8" width="12" height="4.6" rx="1" fill="currentColor" opacity="0.9" />
              <rect x="6" y="11.1" width="12" height="4.6" rx="1" fill="currentColor" opacity="0.9" />
              <rect x="6" y="17.4" width="12" height="4.6" rx="1" fill="currentColor" opacity="0.9" />
              <rect x="6" y="23.7" width="12" height="4.6" rx="1" fill="currentColor" opacity="0.9" />
            </svg>
            <span class="text-base sm:text-lg font-black">4 صور</span>
          </button>
        </div>

        <!-- Single Centered Capture Button with Price -->
        <button
          id="btnStartBooth"
          type="button"
          onclick="handleStartBoothClick()"
          class="capture-btn-pulse w-full px-8 py-9 sm:px-10 sm:py-10 rounded-[2.25rem] bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:via-purple-500 hover:to-pink-500 active:scale-95 text-white border-2 border-white/25 transition-all duration-200 flex flex-col items-center justify-center gap-3"
        >
          <svg class="w-12 h-12 sm:w-14 sm:h-14 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <circle cx="12" cy="13" r="3.5" />
          </svg>
          <span class="text-2xl sm:text-3xl font-black tracking-tight text-center leading-snug">
            أخذ صورة ذكرى بسعر 5,000 د.ع
          </span>
        </button>
      </div>
    </section>

    <!-- ===================================================================== -->
    <!-- SCREEN 2: FULL-SCREEN UNBLURRED CAPTURE (6s INITIAL -> 3s BETWEEN)   -->
    <!-- ===================================================================== -->
    <section id="screenCapture" class="hidden relative w-full h-full flex items-center justify-center bg-black overflow-hidden">
      <video id="liveVideo" autoplay playsinline muted class="w-full h-full object-cover live-camera-feed mirrored hidden"></video>
      <canvas id="liveSimCanvas" width="1280" height="720" class="w-full h-full object-cover live-camera-feed mirrored hidden"></canvas>

      <!-- Shot progress indicator (1/3, 2/3, 3/3) -->
      <div class="fixed top-4 right-4 z-20 pointer-events-none">
        <div id="captureShotCounter" class="px-4 py-2 rounded-2xl bg-slate-950/75 border border-white/20 text-sm sm:text-base font-black text-white shadow-lg">
          1/3
        </div>
      </div>

      <!-- Countdown Overlay -->
      <div id="countdownOverlay" class="hidden fixed inset-0 z-20 flex flex-col items-center justify-center pointer-events-none bg-black/20">
        <div id="countdownNumber" class="count-pop text-8xl sm:text-[9rem] font-black text-white drop-shadow-[0_10px_35px_rgba(0,0,0,0.85)] leading-none">
          6
        </div>
      </div>
    </section>

    <!-- ===================================================================== -->
    <!-- SCREEN 3: THEMES + DUAL STRIP / POSTCARD + DIRECT PRINT             -->
    <!-- ===================================================================== -->
    <section id="screenPrint" class="hidden relative w-full h-full p-3 sm:p-5 lg:p-6 flex flex-col lg:flex-row gap-4 lg:gap-6 items-stretch justify-center overflow-hidden">
      <!-- Left / Top Preview Column: 4x6 Canon SELPHY Composition -->
      <div class="lg:w-1/2 h-[42%] lg:h-full glass-panel rounded-3xl p-3 sm:p-5 flex items-center justify-center relative overflow-hidden">
        <img
          id="composedPreviewImg"
          alt="معاينة الصورة النهائية"
          class="max-h-full w-auto rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.85)] border-2 border-white/20 object-contain"
        />
      </div>

      <!-- Controls Column: One-Tap Themes + Layout Toggle + Direct Print -->
      <div class="lg:w-1/2 h-[58%] lg:h-full glass-panel rounded-3xl p-3.5 sm:p-5 lg:p-6 flex flex-col justify-between gap-2.5 overflow-hidden">
        <div class="flex flex-col gap-2.5 overflow-y-auto pr-0.5">
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-base sm:text-xl font-black text-white">الثيم</h2>

            <!-- Layout Switcher: بوست كارد (4×6) / شريطين (2×6) -->
            <div class="inline-flex rounded-xl bg-slate-900/90 p-1 border border-white/15 shrink-0" role="group" aria-label="قياس الطباعة">
              <button
                type="button"
                data-layout="postcard"
                onclick="selectPrintLayout('postcard')"
                class="layout-pill-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-black transition bg-indigo-600 text-white shadow"
              >
                بوست كارد (4×6)
              </button>
              <button
                type="button"
                data-layout="dual_strip"
                onclick="selectPrintLayout('dual_strip')"
                class="layout-pill-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-black transition text-slate-300 hover:text-white"
              >
                شريطين (2×6)
              </button>
            </div>
          </div>

          <!-- Simple One-Tap Themes Grid -->
          <div id="themesGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2">
            <button
              type="button"
              data-theme="kids"
              onclick="selectTheme('kids')"
              class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-amber-500/25 border-amber-300 text-white shadow"
            >
              <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-amber-300 to-sky-400"></span>
              <span class="text-xs sm:text-sm font-black leading-tight">أطفال</span>
            </button>

            <button
              type="button"
              data-theme="girls"
              onclick="selectTheme('girls')"
              class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-pink-400/60 text-slate-200"
            >
              <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-pink-400 to-rose-500"></span>
              <span class="text-xs sm:text-sm font-black leading-tight">بنات</span>
            </button>

            <button
              type="button"
              data-theme="boys"
              onclick="selectTheme('boys')"
              class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-cyan-400/60 text-slate-200"
            >
              <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-cyan-400 to-blue-600"></span>
              <span class="text-xs sm:text-sm font-black leading-tight">أولاد</span>
            </button>

            <button
              type="button"
              data-theme="adults"
              onclick="selectTheme('adults')"
              class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-yellow-400/60 text-slate-200"
            >
              <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-neutral-900 to-amber-500"></span>
              <span class="text-xs sm:text-sm font-black leading-tight">كبار</span>
            </button>

            <button
              type="button"
              data-theme="royal_white"
              onclick="selectTheme('royal_white')"
              class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-amber-200/70 text-slate-200"
            >
              <span class="w-5 h-5 rounded-full shrink-0 border border-slate-400 bg-gradient-to-br from-white to-amber-200"></span>
              <span class="text-xs sm:text-sm font-black leading-tight">أبيض ملكي</span>
            </button>

            <button
              type="button"
              data-theme="pastel"
              onclick="selectTheme('pastel')"
              class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-teal-300/60 text-slate-200"
            >
              <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-emerald-200 via-purple-200 to-rose-200"></span>
              <span class="text-xs sm:text-sm font-black leading-tight">باستيل</span>
            </button>
          </div>
        </div>

        <!-- Primary Print & Reset Actions -->
        <div class="flex flex-col gap-2 pt-2 border-t border-white/10 shrink-0">
          <button
            id="btnDirectPrint"
            type="button"
            onclick="triggerDirectPrint()"
            class="w-full py-4 px-5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 active:scale-[0.98] text-white font-black text-base sm:text-lg shadow-xl transition flex items-center justify-center gap-2"
          >
            <span>طباعة فورية — الاستلام من الكاشير</span>
          </button>

          <button
            id="btnFinishReset"
            type="button"
            onclick="resetToStartScreen()"
            class="w-full py-3.5 px-5 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-[0.98] border border-white/15 text-slate-100 font-extrabold text-sm sm:text-base transition flex items-center justify-center gap-2"
          >
            <span>بدء من جديد</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 1200x1800 px (100mm x 148mm / 4x6 inch at 300 DPI) Canon SELPHY Canvas -->
    <canvas id="selphyCanvas" width="1200" height="1800" class="hidden"></canvas>
  </div>

  <script>
    /**
     * Kiosk State & Configuration
     */
    const STATE = {
      screen: 'start',          // 'start' | 'capture' | 'print'
      shotCount: 3,             // 3 or 4 photos per session
      initialCountdownSec: 6,   // 6 seconds before Shot 1
      betweenShotsSec: 3,       // 3 seconds between subsequent shots
      selectedTheme: 'kids',    // 'kids' | 'girls' | 'boys' | 'adults' | 'royal_white' | 'pastel'
      printLayout: 'postcard',  // 'postcard' (4x6) | 'dual_strip' (شريطين 2x6)
      mirrorCamera: true,
      stream: null,
      hasLiveVideoStream: false,
      capturedPhotos: [],       // Captured frame Data URLs
      isCaptureRunning: false,
      sessionId: 0,             // Monotonic session token to cancel stale loops
      simAnimFrame: null,
      audioCtx: null
    };

    /**
     * Theme Definitions for 1200x1800 (4x6 inch / 100mm x 148mm at 300 DPI) Print Canvas
     * Uses expressive Arabic captions instead of theme names.
     */
    const THEMES = {
      kids: {
        id: 'kids',
        label: 'أطفال',
        topCaption: 'أحلى لحظات العمر',
        bottomCaption: 'ضحكتك تنور المكان',
        bgTop: '#FFF7ED',
        bgBottom: '#E0F2FE',
        matColor: '#FEF3C7',
        borderColor: '#F59E0B',
        accentColor: '#0284C7',
        textColor: '#0F172A',
        stickerLeft: '⭐',
        stickerRight: '🎈',
        pattern: 'stars'
      },
      girls: {
        id: 'girls',
        label: 'بنات',
        topCaption: 'لحظات تبقى بالقلب',
        bottomCaption: 'إشراقة لا مثيل لها',
        bgTop: '#FFF1F2',
        bgBottom: '#FCE7F3',
        matColor: '#FFE4E6',
        borderColor: '#EC4899',
        accentColor: '#E11D48',
        textColor: '#831843',
        stickerLeft: '💖',
        stickerRight: '✨',
        pattern: 'hearts'
      },
      boys: {
        id: 'boys',
        label: 'أولاد',
        topCaption: 'أسعد الأوقات معاً',
        bottomCaption: 'مغامرة وذكريات جميلة',
        bgTop: '#061224',
        bgBottom: '#0F172A',
        matColor: '#0B1E38',
        borderColor: '#06B6D4',
        accentColor: '#3B82F6',
        textColor: '#E0F2FE',
        stickerLeft: '⚡',
        stickerRight: '🎮',
        pattern: 'neon'
      },
      adults: {
        id: 'adults',
        label: 'كبار',
        topCaption: 'ذكريات لا تُنسى',
        bottomCaption: 'لحظات استثنائية تدوم',
        bgTop: '#09090B',
        bgBottom: '#1C1917',
        matColor: '#1F1B18',
        borderColor: '#EAB308',
        accentColor: '#FACC15',
        textColor: '#FEF08A',
        stickerLeft: '✨',
        stickerRight: '🥂',
        pattern: 'gold'
      },
      royal_white: {
        id: 'royal_white',
        label: 'أبيض ملكي',
        topCaption: 'بداية حكاية جميلة',
        bottomCaption: 'نقاء اللحظة وجمالها',
        bgTop: '#FFFFFF',
        bgBottom: '#F8FAFC',
        matColor: '#F1F5F9',
        borderColor: '#C5A059',
        accentColor: '#A16207',
        textColor: '#1E293B',
        stickerLeft: '🤍',
        stickerRight: '❖',
        pattern: 'classic'
      },
      pastel: {
        id: 'pastel',
        label: 'باستيل',
        topCaption: 'أجمل ما في اليوم',
        bottomCaption: 'فرحة تملأ المكان',
        bgTop: '#ECFDF5',
        bgBottom: '#F3E8FF',
        matColor: '#FAF5FF',
        borderColor: '#A78BFA',
        accentColor: '#10B981',
        textColor: '#312E81',
        stickerLeft: '🌸',
        stickerRight: '🌿',
        pattern: 'pastel'
      }
    };

    /**
     * Select 3 or 4 shots on the home screen and update UI buttons
     */
    function selectShotCount(count) {
      if (count !== 3 && count !== 4) return;
      STATE.shotCount = count;

      document.querySelectorAll('.shot-count-btn').forEach((btn) => {
        const val = Number(btn.getAttribute('data-shots'));
        const active = val === count;
        btn.className = active
          ? 'shot-count-btn py-2.5 px-3 rounded-2xl border-2 flex items-center justify-center gap-3 transition bg-indigo-600/45 border-amber-300 text-white shadow'
          : 'shot-count-btn py-2.5 px-3 rounded-2xl border-2 flex items-center justify-center gap-3 transition bg-slate-900/70 border-white/15 text-slate-200 hover:border-white/35';
      });
    }

    /**
     * Lock viewport against pinch-zoom, multi-touch pan, double-tap zoom, and context menus
     */
    function installViewportLocks() {
      document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });

      document.addEventListener('gesturestart', (e) => {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('gesturechange', (e) => {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('gestureend', (e) => {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    }

    /**
     * Web Audio API Shutter Sound (no external audio files)
     */
    function playShutterSound() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        if (!STATE.audioCtx) {
          STATE.audioCtx = new AudioContextClass();
        }
        if (STATE.audioCtx.state === 'suspended') {
          STATE.audioCtx.resume().catch(() => {});
        }

        const ctx = STATE.audioCtx;
        const now = ctx.currentTime;

        // Crisp mechanical shutter click burst
        const bufferSize = Math.floor(ctx.sampleRate * 0.09);
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
        }

        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1800, now);
        filter.Q.setValueAtTime(1.2, now);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start(now);
        noise.stop(now + 0.09);
      } catch (err) {
        // Ignore audio errors if restricted by browser policy
      }
    }

    /**
     * Smooth animated studio canvas fallback when camera stream is unavailable or blocked
     */
    function startSimulatedCameraLoop() {
      if (STATE.simAnimFrame) {
        cancelAnimationFrame(STATE.simAnimFrame);
      }

      const bgCanvas = document.getElementById('bgSimCanvas');
      const liveCanvas = document.getElementById('liveSimCanvas');
      const canvases = [bgCanvas, liveCanvas].filter(Boolean);

      const renderFrame = (timeMs) => {
        const t = timeMs * 0.001;
        canvases.forEach((canvas) => {
          const ctx = canvas.getContext('2d');
          if (!ctx) return;
          const w = canvas.width;
          const h = canvas.height;

          const grad = ctx.createLinearGradient(0, 0, w, h);
          grad.addColorStop(0, '#1e1b4b');
          grad.addColorStop(0.5, '#3b0764');
          grad.addColorStop(1, '#0f172a');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);

          const orbs = [
            { x: w * (0.3 + 0.12 * Math.sin(t * 0.85)), y: h * (0.4 + 0.1 * Math.cos(t * 0.65)), r: w * 0.24, color: 'rgba(99, 102, 241, 0.36)' },
            { x: w * (0.72 + 0.1 * Math.cos(t * 0.75)), y: h * (0.55 + 0.12 * Math.sin(t * 0.6)), r: w * 0.25, color: 'rgba(236, 72, 153, 0.32)' },
            { x: w * 0.5, y: h * 0.48, r: w * 0.16, color: 'rgba(56, 189, 248, 0.2)' }
          ];

          orbs.forEach((orb) => {
            const rg = ctx.createRadialGradient(orb.x, orb.y, 10, orb.x, orb.y, orb.r);
            rg.addColorStop(0, orb.color);
            rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
            ctx.fill();
          });

          // Subtle studio portrait silhouette guide
          ctx.save();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(w * 0.5, h * 0.4, h * 0.13, 0, Math.PI * 2);
          ctx.stroke();

          ctx.beginPath();
          ctx.ellipse(w * 0.5, h * 0.74, h * 0.22, h * 0.16, 0, Math.PI, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        });

        STATE.simAnimFrame = requestAnimationFrame(renderFrame);
      };

      STATE.simAnimFrame = requestAnimationFrame(renderFrame);
    }

    /**
     * Switch between 'start' | 'capture' | 'print' screens
     */
    function setActiveScreen(target) {
      STATE.screen = target;
      document.getElementById('screenStart').classList.toggle('hidden', target !== 'start');
      document.getElementById('screenCapture').classList.toggle('hidden', target !== 'capture');
      document.getElementById('screenPrint').classList.toggle('hidden', target !== 'print');
      syncCameraVisualTargets();
    }

    /**
     * Synchronize <video> vs simulated <canvas> visibility across screens
     */
    function syncCameraVisualTargets() {
      const bgVideo = document.getElementById('bgVideo');
      const bgSim = document.getElementById('bgSimCanvas');
      const liveVideo = document.getElementById('liveVideo');
      const liveSim = document.getElementById('liveSimCanvas');

      const useLiveVideo = Boolean(STATE.hasLiveVideoStream && STATE.stream);

      [bgVideo, liveVideo].forEach((vid) => {
        if (!vid) return;
        if (useLiveVideo) {
          if (vid.srcObject !== STATE.stream) {
            vid.srcObject = STATE.stream;
          }
          vid.classList.toggle('mirrored', STATE.mirrorCamera);
          vid.play().catch(() => {});
        } else {
          vid.pause();
        }
      });

      if (bgVideo) bgVideo.classList.toggle('hidden', !(STATE.screen === 'start' && useLiveVideo));
      if (bgSim) bgSim.classList.toggle('hidden', !(STATE.screen === 'start' && !useLiveVideo));
      if (liveVideo) liveVideo.classList.toggle('hidden', !(STATE.screen === 'capture' && useLiveVideo));
      if (liveSim) liveSim.classList.toggle('hidden', !(STATE.screen === 'capture' && !useLiveVideo));
    }

    /**
     * Request camera stream with clean fallback to animated canvas
     */
    async function tryOpenCameraStream() {
      if (STATE.hasLiveVideoStream && STATE.stream) {
        const activeTracks = STATE.stream.getVideoTracks().filter((t) => t.readyState === 'live');
        if (activeTracks.length > 0) {
          syncCameraVisualTargets();
          return true;
        }
      }

      if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
        STATE.hasLiveVideoStream = false;
        syncCameraVisualTargets();
        return false;
      }

      const constraintsList = [
        { video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
        { video: true, audio: false }
      ];

      for (let i = 0; i < constraintsList.length; i++) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraintsList[i]);
          if (stream && stream.getVideoTracks().length > 0) {
            STATE.stream = stream;
            STATE.hasLiveVideoStream = true;

            const bgVideo = document.getElementById('bgVideo');
            const liveVideo = document.getElementById('liveVideo');
            if (bgVideo) {
              bgVideo.srcObject = stream;
              await bgVideo.play().catch(() => {});
            }
            if (liveVideo) {
              liveVideo.srcObject = stream;
              await liveVideo.play().catch(() => {});
            }

            syncCameraVisualTargets();
            return true;
          }
        } catch (err) {
          // Try next fallback constraint or fall back to simulated canvas
        }
      }

      STATE.stream = null;
      STATE.hasLiveVideoStream = false;
      syncCameraVisualTargets();
      return false;
    }

    async function ensureCameraReady() {
      const ok = await tryOpenCameraStream();
      if (!ok) {
        startSimulatedCameraLoop();
      }
      return ok;
    }

    /**
     * Cover-fit helper for drawing media without distortion
     */
    function drawCoverFit(ctx, source, srcW, srcH, dx, dy, dw, dh) {
      if (!srcW || !srcH || !dw || !dh) return;
      const srcAspect = srcW / srcH;
      const dstAspect = dw / dh;

      let sx = 0;
      let sy = 0;
      let sWidth = srcW;
      let sHeight = srcH;

      if (srcAspect > dstAspect) {
        sWidth = srcH * dstAspect;
        sx = (srcW - sWidth) * 0.5;
      } else {
        sHeight = srcW / dstAspect;
        sy = (srcH - sHeight) * 0.5;
      }

      ctx.drawImage(source, sx, sy, sWidth, sHeight, dx, dy, dw, dh);
    }

    /**
     * Contain-fit helper that keeps the ENTIRE photo uncropped inside a styled mat/frame
     */
    function drawContainInMat(ctx, img, matX, matY, matW, matH, matColor, accentColor, radius = 20) {
      ctx.save();
      roundRectPath(ctx, matX, matY, matW, matH, radius);
      ctx.fillStyle = matColor || '#1e293b';
      ctx.fill();
      ctx.clip();

      const pad = Math.max(8, Math.min(matW, matH) * 0.04);
      const innerX = matX + pad;
      const innerY = matY + pad;
      const innerW = Math.max(10, matW - pad * 2);
      const innerH = Math.max(10, matH - pad * 2);

      const srcW = img.width || 1200;
      const srcH = img.height || 800;
      const scale = Math.min(innerW / srcW, innerH / srcH);
      const drawW = srcW * scale;
      const drawH = srcH * scale;
      const drawX = innerX + (innerW - drawW) * 0.5;
      const drawY = innerY + (innerH - drawH) * 0.5;

      const innerRadius = Math.max(8, radius - 6);
      roundRectPath(ctx, drawX, drawY, drawW, drawH, innerRadius);
      ctx.save();
      ctx.clip();
      ctx.drawImage(img, drawX, drawY, drawW, drawH);
      ctx.restore();

      ctx.strokeStyle = accentColor || '#ffffff';
      ctx.lineWidth = 3;
      roundRectPath(ctx, drawX, drawY, drawW, drawH, innerRadius);
      ctx.stroke();

      ctx.restore();

      ctx.save();
      ctx.strokeStyle = accentColor || '#ffffff';
      ctx.lineWidth = 4;
      roundRectPath(ctx, matX, matY, matW, matH, radius);
      ctx.stroke();
      ctx.restore();
    }

    function triggerCameraFlash() {
      const flash = document.getElementById('flashOverlay');
      if (!flash) return;
      flash.classList.remove('flash-burst');
      void flash.offsetWidth;
      flash.classList.add('flash-burst');
    }

    function delayMs(ms, sessionToken) {
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve(sessionToken === STATE.sessionId);
        }, ms);
      });
    }

    /**
     * Capture a full-frame photo from live video or simulated canvas preserving natural aspect ratio
     */
    function captureFrameDataUrl() {
      const useLiveVideo = Boolean(STATE.hasLiveVideoStream && STATE.stream);
      const liveVideo = document.getElementById('liveVideo');
      const liveSim = document.getElementById('liveSimCanvas');

      let srcW = 1280;
      let srcH = 720;
      let sourceEl = liveSim;

      if (useLiveVideo && liveVideo && liveVideo.readyState >= 2 && liveVideo.videoWidth > 0 && liveVideo.videoHeight > 0) {
        srcW = liveVideo.videoWidth;
        srcH = liveVideo.videoHeight;
        sourceEl = liveVideo;
      } else if (liveSim) {
        srcW = liveSim.width || 1280;
        srcH = liveSim.height || 720;
        sourceEl = liveSim;
      } else {
        const bgSim = document.getElementById('bgSimCanvas');
        if (bgSim) {
          srcW = bgSim.width || 1280;
          srcH = bgSim.height || 720;
          sourceEl = bgSim;
        }
      }

      const maxDim = 1200;
      const ratio = Math.min(1, maxDim / Math.max(srcW, srcH));
      const snapCanvas = document.createElement('canvas');
      snapCanvas.width = Math.max(1, Math.round(srcW * ratio));
      snapCanvas.height = Math.max(1, Math.round(srcH * ratio));
      const ctx = snapCanvas.getContext('2d');

      ctx.save();
      if (STATE.mirrorCamera) {
        ctx.translate(snapCanvas.width, 0);
        ctx.scale(-1, 1);
      }

      if (sourceEl) {
        ctx.drawImage(sourceEl, 0, 0, snapCanvas.width, snapCanvas.height);
      }

      ctx.restore();
      return snapCanvas.toDataURL('image/jpeg', 0.94);
    }

    /**
     * Start capture flow: 6s initial countdown -> Shot 1 -> 3s wait between shots
     */
    async function runCountdown(seconds, sessionToken) {
      const overlay = document.getElementById('countdownOverlay');
      const numEl = document.getElementById('countdownNumber');
      if (!overlay || !numEl) return false;

      overlay.classList.remove('hidden');

      for (let s = seconds; s >= 1; s--) {
        if (sessionToken !== STATE.sessionId) {
          overlay.classList.add('hidden');
          return false;
        }
        numEl.textContent = String(s);
        numEl.classList.remove('count-pop');
        void numEl.offsetWidth;
        numEl.classList.add('count-pop');

        const ok = await delayMs(1000, sessionToken);
        if (!ok) {
          overlay.classList.add('hidden');
          return false;
        }
      }

      overlay.classList.add('hidden');
      return true;
    }

    /**
     * Draw rich vector-drawn background accents and borders for each theme on 1200x1800 canvas
     */
    function drawThemeBackground(ctx, theme, width, height) {
      const grad = ctx.createLinearGradient(0, 0, width * 0.25, height);
      grad.addColorStop(0, theme.bgTop);
      grad.addColorStop(1, theme.bgBottom);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      if (theme.pattern === 'stars') {
        ctx.fillStyle = 'rgba(245, 158, 11, 0.14)';
        for (let y = 140; y < height - 100; y += 220) {
          for (let x = 110; x < width; x += 240) {
            ctx.beginPath();
            ctx.arc(x + ((y / 220) % 2) * 60, y, 16, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      } else if (theme.pattern === 'hearts') {
        ctx.strokeStyle = 'rgba(236, 72, 153, 0.18)';
        ctx.lineWidth = 3;
        for (let y = 160; y < height - 120; y += 260) {
          ctx.beginPath();
          ctx.arc(105, y, 36, 0, Math.PI * 2);
          ctx.arc(width - 105, y + 80, 44, 0, Math.PI * 2);
          ctx.stroke();
        }
      } else if (theme.pattern === 'neon') {
        ctx.strokeStyle = 'rgba(6, 182, 212, 0.16)';
        ctx.lineWidth = 2;
        for (let x = 70; x < width; x += 110) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(59, 130, 246, 0.22)';
        ctx.lineWidth = 4;
        ctx.strokeRect(46, 46, width - 92, height - 92);
      } else if (theme.pattern === 'gold') {
        ctx.strokeStyle = 'rgba(234, 179, 8, 0.28)';
        ctx.lineWidth = 3;
        ctx.strokeRect(48, 48, width - 96, height - 96);
        ctx.strokeRect(62, 62, width - 124, height - 124);
      } else if (theme.pattern === 'pastel') {
        ctx.fillStyle = 'rgba(167, 139, 250, 0.16)';
        ctx.beginPath();
        ctx.arc(160, 220, 150, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(52, 211, 153, 0.16)';
        ctx.beginPath();
        ctx.arc(width - 150, height - 220, 170, 0, Math.PI * 2);
        ctx.fill();
      } else if (theme.pattern === 'classic') {
        ctx.strokeStyle = 'rgba(197, 160, 89, 0.35)';
        ctx.lineWidth = 3;
        ctx.strokeRect(46, 46, width - 92, height - 92);
        ctx.strokeStyle = 'rgba(197, 160, 89, 0.18)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(60, 60, width - 120, height - 120);
      }
      ctx.restore();

      // Outer frame border
      ctx.save();
      ctx.strokeStyle = theme.borderColor;
      ctx.lineWidth = 14;
      roundRectPath(ctx, 24, 24, width - 48, height - 48, 36);
      ctx.stroke();
      ctx.restore();
    }

    /**
     * Render single 2x6 photo strip (600x1800 px) for dual-strip (شريطين) mode
     */
    function renderSingleStrip(ctx, theme, images, stripX, stripY, stripW, stripH) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(stripX, stripY, stripW, stripH);
      ctx.clip();

      const grad = ctx.createLinearGradient(stripX, stripY, stripX, stripY + stripH);
      grad.addColorStop(0, theme.bgTop);
      grad.addColorStop(1, theme.bgBottom);
      ctx.fillStyle = grad;
      ctx.fillRect(stripX, stripY, stripW, stripH);

      ctx.strokeStyle = theme.borderColor;
      ctx.lineWidth = 8;
      ctx.strokeRect(stripX + 10, stripY + 10, stripW - 20, stripH - 20);

      const padX = 28;
      const topPad = 34;
      const bottomHeaderH = 140;
      const gap = 18;
      const count = images.length;
      const availH = stripH - topPad - bottomHeaderH - gap * (count - 1);
      const photoH = availH / count;
      const photoW = stripW - padX * 2;

      for (let i = 0; i < count; i++) {
        const py = topPad + i * (photoH + gap);
        drawContainInMat(
          ctx,
          images[i],
          stripX + padX,
          py,
          photoW,
          photoH,
          theme.matColor,
          theme.accentColor,
          16
        );
      }

      // Expressive caption (not the theme name)
      ctx.fillStyle = theme.textColor;
      ctx.font = '800 28px Cairo, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${theme.stickerLeft} ${theme.topCaption} ${theme.stickerRight}`, stripX + stripW / 2, stripY + stripH - 72);

      ctx.restore();
    }

    /**
     * Render 1200x1800 px (100mm x 148mm / 4x6 inch at 300 DPI) Canon SELPHY composition
     */
    async function renderSelphyComposition() {
      const canvas = document.getElementById('selphyCanvas');
      if (!canvas) return;
      canvas.width = 1200;
      canvas.height = 1800;

      const ctx = canvas.getContext('2d');
      const theme = THEMES[STATE.selectedTheme] || THEMES.kids;

      const sources = STATE.capturedPhotos.length > 0
        ? STATE.capturedPhotos
        : [captureFrameDataUrl()];

      const loadedImages = [];
      for (let i = 0; i < sources.length; i++) {
        try {
          const img = await loadImageElement(sources[i]);
          loadedImages.push(img);
        } catch (err) {}
      }

      if (loadedImages.length === 0) {
        const fallbackCanvas = document.createElement('canvas');
        fallbackCanvas.width = 1200;
        fallbackCanvas.height = 800;
        const fctx = fallbackCanvas.getContext('2d');
        fctx.fillStyle = '#1e293b';
        fctx.fillRect(0, 0, 1200, 800);
        const fallbackImg = await loadImageElement(fallbackCanvas.toDataURL('image/jpeg'));
        loadedImages.push(fallbackImg);
      }

      const W = canvas.width;
      const H = canvas.height;

      if (STATE.printLayout === 'dual_strip') {
        // Two 2x6 strips (600x1800 each) side-by-side on 1200x1800 4x6 sheet
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, W, H);

        renderSingleStrip(ctx, theme, loadedImages, 0, 0, 600, H);
        renderSingleStrip(ctx, theme, loadedImages, 600, 0, 600, H);

        // Subtle center cut guide line
        ctx.save();
        ctx.setLineDash([12, 10]);
        ctx.strokeStyle = 'rgba(100, 116, 139, 0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(600, 20);
        ctx.lineTo(600, H - 20);
        ctx.stroke();
        ctx.restore();
      } else {
        // Full 4x6 postcard layout (1200x1800 px)
        drawThemeBackground(ctx, theme, W, H);

        const headerHeight = 148;
        const footerHeight = 128;
        const sideMargin = 64;
        const gap = countGapForShots(loadedImages.length);
        const count = loadedImages.length;

        // Top expressive caption (not theme name)
        ctx.fillStyle = theme.textColor;
        ctx.font = '900 44px Cairo, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${theme.stickerLeft}  ${theme.topCaption}  ${theme.stickerRight}`, W / 2, 90);

        const availH = H - headerHeight - footerHeight - gap * (count - 1);
        const cellH = availH / count;
        const cellW = W - sideMargin * 2;

        for (let i = 0; i < count; i++) {
          const y = headerHeight + i * (cellH + gap);
          drawContainInMat(
            ctx,
            loadedImages[i],
            sideMargin,
            y,
            cellW,
            cellH,
            theme.matColor,
            theme.accentColor,
            22
          );
        }

        // Bottom expressive caption (not theme name)
        ctx.fillStyle = theme.textColor;
        ctx.font = '800 36px Cairo, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${theme.stickerLeft}  ${theme.bottomCaption}  ${theme.stickerRight}`, W / 2, H - 64);
      }

      const dataUrl = canvas.toDataURL('image/jpeg', 0.96);
      const previewImg = document.getElementById('composedPreviewImg');
      const printImg = document.getElementById('printOnlyImg');
      if (previewImg) previewImg.src = dataUrl;
      if (printImg) printImg.src = dataUrl;
    }

    function countGapForShots(shotCount) {
      return shotCount >= 4 ? 18 : 26;
    }

    /**
     * One-tap theme selection
     */
    async function selectTheme(themeId) {
      if (!THEMES[themeId]) return;
      STATE.selectedTheme = themeId;

      document.querySelectorAll('.theme-pill-btn').forEach((btn) => {
        const isSelected = btn.getAttribute('data-theme') === themeId;
        btn.className = isSelected
          ? 'theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-indigo-600/35 border-amber-300 text-white shadow'
          : 'theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-white/35 text-slate-200';
      });

      if (STATE.screen === 'print') {
        await renderSelphyComposition();
      }
    }

    /**
     * Switch print layout between Postcard (4×6) and Dual-Strip (شريطين 2×6)
     */
    async function selectPrintLayout(layoutId) {
      if (layoutId !== 'postcard' && layoutId !== 'dual_strip') return;
      STATE.printLayout = layoutId;

      document.querySelectorAll('.layout-pill-btn').forEach((btn) => {
        const isSelected = btn.getAttribute('data-layout') === layoutId;
        btn.className = isSelected
          ? 'layout-pill-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-black transition bg-indigo-600 text-white shadow'
          : 'layout-pill-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-black transition text-slate-300 hover:text-white';
      });

      if (STATE.screen === 'print') {
        await renderSelphyComposition();
      }
    }

    /**
     * Direct print trigger calibrated for Canon SELPHY (4in x 6in / 100mm x 148mm)
     */
    async function triggerDirectPrint() {
      await renderSelphyComposition();
      setTimeout(() => {
        try {
          window.print();
        } catch (err) {}
      }, 100);
    }

    /**
     * Return cleanly to Screen 1 (Start Kiosk)
     */
    async function resetToStartScreen() {
      STATE.sessionId += 1;
      STATE.isCaptureRunning = false;
      STATE.capturedPhotos = [];

      const overlay = document.getElementById('countdownOverlay');
      if (overlay) {
        overlay.classList.add('hidden');
      }

      setActiveScreen('start');
      await ensureCameraReady();
    }

    /**
     * Initialize Kiosk on Load
     */
    window.addEventListener('DOMContentLoaded', async () => {
      installViewportLocks();
      startSimulatedCameraLoop();
      selectShotCount(3);
      await selectTheme('kids');
      await selectPrintLayout('postcard');
      await ensureCameraReady();
    });
  </script>
</body>
