    function getActiveSlotAspectRatio() {
      const count = STATE.shotCount === 4 ? 4 : 3;
      const W = 1200;
      const H = 1800;
      const topHeaderSpace = Math.round(H * 0.088);
      const bottomCaptionSpace = Math.round(H * 0.082);
      const sideMargin = Math.round(W * 0.085);

      if (STATE.printLayout === 'dual_strip') {
        const stripW = W * 0.5;
        const padX = Math.round(stripW * 0.085);
        const topPad = Math.round(H * 0.068);
        const bottomSpace = Math.round(H * 0.125);
        const gap = Math.round(H * 0.012);
        const photoW = stripW - padX * 2;
        const photoH = (H - topPad - bottomSpace - gap * (count - 1)) / count;
        return Math.max(0.2, photoW / Math.max(1, photoH));
      }

      if (count === 4) {
        const gapX = Math.round(W * 0.024);
        const gapY = Math.round(H * 0.016);
        const cellW = (W - sideMargin * 2 - gapX) / 2;
        const cellH = (H - Math.round(H * 0.08) - topHeaderSpace - bottomCaptionSpace - gapY) / 2;
        return Math.max(0.2, cellW / Math.max(1, cellH));
      }

      const gap = Math.round(H * 0.015);
      const cellW = W - sideMargin * 2;
      const cellH = (H - Math.round(H * 0.08) - topHeaderSpace - bottomCaptionSpace - gap * (count - 1)) / count;
      return Math.max(0.2, cellW / Math.max(1, cellH));
    }

    function computeCoverGuideRect(containerW, containerH, targetAspect) {
      const safeW = Math.max(1, containerW);
      const safeH = Math.max(1, containerH);
      const maxW = safeW * 0.72;
      const maxH = safeH * 0.68;
      const defaultAspect = STATE.printLayout === 'postcard' ? (2 / 3) : (targetAspect || (2 / 3));
      const safeAspect = Math.max(0.25, Math.min(4.0, defaultAspect));

      let w = maxW;
      let h = w / safeAspect;
      if (h > maxH) {
        h = maxH;
        w = h * safeAspect;
      }

      const x = (safeW - w) * 0.5;
      const y = (safeH - h) * 0.5;
      return { x, y, w, h };
    }

    function updateFramingGuideOverlay(useLiveVideo, shouldMirror) {
      const overlay = document.getElementById('framingGuideOverlay');
      const backdrop = document.getElementById('framingGuideBackdrop');
      const clearWin = document.getElementById('framingGuideClearWindow');
      const clearVid = document.getElementById('framingGuideClearVideo');
      const clearCan = document.getElementById('framingGuideClearCanvas');
      const captureEl = document.getElementById('captureScreen');

      if (!overlay || !backdrop || !clearWin) return;
      if (STATE.screen !== 'capture') {
        overlay.classList.add('hidden');
        return;
      }
      overlay.classList.remove('hidden');

      const rectSource = captureEl || document.getElementById('app') || document.body;
      const rect = rectSource.getBoundingClientRect();
      const cw = Math.max(320, rect.width || window.innerWidth || 1280);
      const ch = Math.max(240, rect.height || window.innerHeight || 720);

      const targetAspect = getActiveSlotAspectRatio();
      const box = computeCoverGuideRect(cw, ch, targetAspect);

      clearWin.style.left = `${Number(box.x.toFixed(2))}px`;
      clearWin.style.top = `${Number(box.y.toFixed(2))}px`;
      clearWin.style.width = `${Number(box.w.toFixed(2))}px`;
      clearWin.style.height = `${Number(box.h.toFixed(2))}px`;
      clearWin.style.borderRadius = '28px';

      if (clearVid) {
        clearVid.autoplay = true;
        clearVid.playsInline = true;
        clearVid.muted = true;
        clearVid.defaultMuted = true;
        if (STATE.stream && clearVid.srcObject !== STATE.stream) {
          clearVid.srcObject = STATE.stream;
        }
        clearVid.classList.toggle('mirrored', Boolean(shouldMirror));
        clearVid.classList.toggle('hidden', !useLiveVideo);
        if (useLiveVideo && clearVid.paused) {
          try {
            const p = clearVid.play();
            if (p && typeof p.catch === 'function') p.catch(() => {});
          } catch (e) {}
        }
      }

      if (clearCan) {
        clearCan.classList.toggle('mirrored', Boolean(shouldMirror));
        clearCan.classList.toggle('hidden', Boolean(useLiveVideo));
      }
    }

    function cropDataUrlToTargetAspect(dataUrl, targetAspect) {
      return new Promise((resolve) => {
        if (!dataUrl || !targetAspect || targetAspect <= 0) {
          resolve(dataUrl);
          return;
        }
        const img = new Image();
        img.onload = () => {
          const sw = img.naturalWidth || img.width;
          const sh = img.naturalHeight || img.height;
          if (!sw || !sh) {
            resolve(dataUrl);
            return;
          }

          const srcAspect = sw / sh;
          let cropW = sw;
          let cropH = sh;
          let cropX = 0;
          let cropY = 0;

          if (srcAspect > targetAspect) {
            cropW = sh * targetAspect;
            cropX = (sw - cropW) * 0.5;
          } else if (srcAspect < targetAspect) {
            cropH = sw / targetAspect;
            cropY = (sh - cropH) * 0.5;
          }

          const outCanvas = document.createElement('canvas');
          outCanvas.width = Math.max(1, Math.round(cropW));
          outCanvas.height = Math.max(1, Math.round(cropH));
          const octx = outCanvas.getContext('2d');
          octx.imageSmoothingEnabled = true;
          octx.imageSmoothingQuality = 'high';
          octx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, outCanvas.width, outCanvas.height);
          resolve(outCanvas.toDataURL('image/jpeg', 0.95));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    function syncCameraVisualTargets() {
      const bgVideo = document.getElementById('bgVideo');
      const bgSim = document.getElementById('bgSimCanvas');
      const liveVideo = document.getElementById('liveVideo');
      const liveSim = document.getElementById('liveSimCanvas');

      const activeTracks = STATE.stream && typeof STATE.stream.getVideoTracks === 'function'
        ? STATE.stream.getVideoTracks().filter((t) => t.readyState === 'live')
        : [];
      const hasActiveStream = Boolean(STATE.stream && activeTracks.length > 0);
      const hasVideoDimensions = Boolean(
        hasActiveStream && (
          (liveVideo && liveVideo.videoWidth > 0 && liveVideo.videoHeight > 0) ||
          (bgVideo && bgVideo.videoWidth > 0 && bgVideo.videoHeight > 0)
        )
      );
      const useLiveVideo = Boolean(hasActiveStream && (STATE.hasLiveVideoStream || hasVideoDimensions));
      const shouldMirror = STATE.mirrorCamera && STATE.facingMode === 'user';

      [bgVideo, liveVideo].forEach((vid) => {
        if (!vid) return;
        vid.autoplay = true;
        vid.playsInline = true;
        vid.muted = true;
        vid.defaultMuted = true;
        vid.setAttribute('autoplay', '');
        vid.setAttribute('playsinline', '');
        vid.setAttribute('webkit-playsinline', '');
        vid.setAttribute('muted', '');

        if (hasActiveStream) {
          if (vid.srcObject !== STATE.stream) vid.srcObject = STATE.stream;
          vid.classList.toggle('mirrored', shouldMirror);
          if (vid.paused || vid.readyState < 2) {
            Promise.resolve().then(() => {
              try {
                const playPromise = vid.play();
                if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
              } catch (e) {}
            });
          }
        }
      });

      [bgSim, liveSim].forEach((sim) => {
        if (sim) sim.classList.toggle('mirrored', shouldMirror);
      });

      if (bgVideo) bgVideo.classList.toggle('hidden', !(STATE.screen === 'start' && useLiveVideo));
      if (bgSim) bgSim.classList.toggle('hidden', !(STATE.screen === 'start' && !useLiveVideo));
      updateFramingGuideOverlay(useLiveVideo, shouldMirror);
    }

    function stopExistingStreamTracks() {
      if (STATE.stream && typeof STATE.stream.getTracks === 'function') {
        STATE.stream.getTracks().forEach((track) => {
          try { track.stop(); } catch (e) {}
        });
      }
      STATE.stream = null;
      STATE.hasLiveVideoStream = false;
    }

    function attachStreamToVideos(stream) {
      if (!stream) return;
      STATE.stream = stream;

      const bgVideo = document.getElementById('bgVideo');
      const liveVideo = document.getElementById('liveVideo');
      const shouldMirror = STATE.mirrorCamera && STATE.facingMode === 'user';

      [bgVideo, liveVideo].forEach((vid) => {
        if (!vid) return;
        vid.autoplay = true;
        vid.playsInline = true;
        vid.muted = true;
        vid.defaultMuted = true;
        vid.classList.toggle('mirrored', shouldMirror);
        if (vid.srcObject !== stream) vid.srcObject = stream;

        const ensurePlaying = () => {
          if (vid.srcObject !== stream) vid.srcObject = stream;
          if (vid.videoWidth > 0 && vid.videoHeight > 0) STATE.hasLiveVideoStream = true;
          try {
            const playPromise = vid.play();
            if (playPromise && typeof playPromise.then === 'function') {
              playPromise.then(() => {
                if (vid.videoWidth > 0 && vid.videoHeight > 0) STATE.hasLiveVideoStream = true;
                syncCameraVisualTargets();
              }).catch(() => syncCameraVisualTargets());
            } else {
              syncCameraVisualTargets();
            }
          } catch (err) {
            syncCameraVisualTargets();
          }
        };

        vid.onloadedmetadata = ensurePlaying;
        vid.oncanplay = ensurePlaying;
        ensurePlaying();
      });

      syncCameraVisualTargets();
    }

    function requestRawMediaStream(constraints) {
      if (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function') {
        return navigator.mediaDevices.getUserMedia(constraints);
      }
      const legacyGetUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia;
      if (typeof legacyGetUserMedia === 'function') {
        return new Promise((resolve, reject) => {
          try { legacyGetUserMedia.call(navigator, constraints, resolve, reject); } catch (err) { reject(err); }
        });
      }
      return Promise.reject(new Error('Camera API unavailable'));
    }

    async function getEnumeratedVideoDeviceIds() {
      const deviceIds = [];
      try {
        if (navigator.mediaDevices && typeof navigator.mediaDevices.enumerateDevices === 'function') {
          const devices = await navigator.mediaDevices.enumerateDevices();
          if (Array.isArray(devices)) {
            devices.forEach((dev) => {
              if (dev && dev.kind === 'videoinput' && dev.deviceId) deviceIds.push(dev.deviceId);
            });
          }
        }
      } catch (err) {}
      return deviceIds;
    }

    async function requestUserMediaWithFallbacks(facingMode) {
      const constraintSteps = [
        { audio: false, video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } } },
        { audio: false, video: { facingMode: facingMode } },
        { audio: false, video: true }
      ];
      let lastErr = new Error('Camera stream request failed');
      for (const constraints of constraintSteps) {
        try {
          const stream = await requestRawMediaStream(constraints);
          if (stream) return stream;
        } catch (err) { lastErr = err || lastErr; }
      }
      const videoDeviceIds = await getEnumeratedVideoDeviceIds();
      for (const deviceId of videoDeviceIds) {
        try {
          const stream = await requestRawMediaStream({ audio: false, video: { deviceId: { exact: deviceId } } });
          if (stream) return stream;
        } catch (err) { lastErr = err || lastErr; }
      }
      throw lastErr;
    }

    function updateCameraBadgeAndDiagnostics(err = null) {
      const badge = document.getElementById('cameraStatusBadge');
      const codeEl = document.getElementById('diagErrorCode');
      const expEl = document.getElementById('diagExplanation');
      const sugEl = document.getElementById('diagSuggestion');

      if (STATE.hasLiveVideoStream && STATE.stream) {
        if (badge) badge.classList.add('hidden');
        return;
      }

      const errName = (err && (err.name || err.code)) || 'CameraUnavailable';
      STATE.lastCameraError = {
        code: errName,
        name: errName,
        explanation: 'تعذر تشغيل بث الكاميرا الحية حالياً وتم تفعيل وضع المعاينة البديلة تلقائياً.',
        suggestion: 'تحقق من منح إذن الكاميرا للمتصفح والاتصال عبر HTTPS أو localhost، ثم اضغط لإعادة المحاولة.'
      };

      if (badge) badge.classList.remove('hidden');
      if (codeEl) codeEl.textContent = `رمز الحالة: ${STATE.lastCameraError.code}`;
      if (expEl) expEl.textContent = STATE.lastCameraError.explanation;
      if (sugEl) sugEl.textContent = STATE.lastCameraError.suggestion;
    }

    async function initCamera(forceRestart = false) {
      const existingLiveTracks = STATE.stream && typeof STATE.stream.getVideoTracks === 'function'
        ? STATE.stream.getVideoTracks().filter((t) => t.readyState === 'live')
        : [];

      if (!forceRestart && STATE.stream && existingLiveTracks.length > 0) {
        attachStreamToVideos(STATE.stream);
        syncCameraVisualTargets();
        updateCameraBadgeAndDiagnostics();
        return STATE.stream;
      }

      if (STATE.isInitializingCamera && !forceRestart) return STATE.stream;

      STATE.isInitializingCamera = true;
      try {
        if (forceRestart || STATE.stream) stopExistingStreamTracks();
        const stream = await requestUserMediaWithFallbacks(STATE.facingMode);
        STATE.stream = stream;
        STATE.hasLiveVideoStream = true;
        attachStreamToVideos(stream);
        updateCameraBadgeAndDiagnostics(null);
        return stream;
      } catch (err) {
        stopExistingStreamTracks();
        syncCameraVisualTargets();
        updateCameraBadgeAndDiagnostics(err);
        return null;
      } finally {
        STATE.isInitializingCamera = false;
      }
    }

    async function unlockVideoPlaybackOnGesture() {
      const bgVideo = document.getElementById('bgVideo');
      const liveVideo = document.getElementById('liveVideo');
      for (const vid of [liveVideo, bgVideo].filter(Boolean)) {
        if (STATE.stream && vid.srcObject !== STATE.stream) vid.srcObject = STATE.stream;
        if (vid.srcObject) {
          try {
            await vid.play();
            if (vid.videoWidth > 0 && vid.videoHeight > 0) STATE.hasLiveVideoStream = true;
          } catch (err) {}
        }
      }
      syncCameraVisualTargets();
    }

    async function ensureCameraReady(forceRestart = false) {
      const hasLiveTrack = STATE.stream && typeof STATE.stream.getVideoTracks === 'function'
        ? STATE.stream.getVideoTracks().some((t) => t.readyState === 'live')
        : false;
      if (!forceRestart && hasLiveTrack && STATE.stream) {
        attachStreamToVideos(STATE.stream);
        await unlockVideoPlaybackOnGesture();
        return STATE.stream;
      }
      const stream = await initCamera(forceRestart);
      await unlockVideoPlaybackOnGesture();
      return stream;
    }

    function openCameraDiagnostics(show = true) {
      const modal = document.getElementById('cameraDiagModal');
      if (!modal) return;
      if (show) updateCameraBadgeAndDiagnostics(STATE.lastCameraError?.code ? { name: STATE.lastCameraError.code } : null);
      modal.classList.toggle('hidden', !show);
    }

    function closeCameraDiagnostics() { openCameraDiagnostics(false); }

    async function toggleFacingModeAndRestart() {
      STATE.facingMode = STATE.facingMode === 'user' ? 'environment' : 'user';
      await initCamera(true);
    }

    function announceKioskStatus(message, showToast = false) {
      const liveRegion = document.getElementById('kioskLiveStatus');
      if (liveRegion) liveRegion.textContent = message;
      if (!showToast) return;
      const toast = document.getElementById('kioskStatusToast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.remove('hidden');
      clearTimeout(announceKioskStatus._toastTimer);
      announceKioskStatus._toastTimer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    function drawPhotoFittedInRect(ctx, img, slotX, slotY, slotW, slotH, options = {}) {
      if (!ctx || !img || slotW <= 0 || slotH <= 0) return;
      const radius = typeof options.radius === 'number' ? options.radius : 22;
      const borderColor = options.borderColor || 'rgba(255, 255, 255, 0.85)';
      const borderWidth = typeof options.borderWidth === 'number' ? options.borderWidth : 4;

      const imgW = img.naturalWidth || img.width || 1200;
      const imgH = img.naturalHeight || img.height || 800;
      const coverScale = Math.max(slotW / imgW, slotH / imgH);
      const drawW = Math.max(1, imgW * coverScale);
      const drawH = Math.max(1, imgH * coverScale);
      const drawX = slotX + (slotW - drawW) * 0.5;
      const drawY = slotY + (slotH - drawH) * 0.5;

      ctx.save();
      roundRectPath(ctx, slotX, slotY, slotW, slotH, radius);
      ctx.clip();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, imgW, imgH, drawX, drawY, drawW, drawH);
      ctx.restore();

      if (borderWidth > 0) {
        ctx.save();
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = borderWidth;
        roundRectPath(ctx, slotX, slotY, slotW, slotH, radius);
        ctx.stroke();
        ctx.restore();
      }
    }

    function triggerCameraFlash() {
      const flash = document.getElementById('flashOverlay');
      if (!flash) return;
      flash.classList.remove('flash-burst');
      void flash.offsetWidth;
      flash.classList.add('flash-burst');
    }

    function delayMs(ms, sessionToken) {
      return new Promise((resolve) => setTimeout(() => resolve(sessionToken === STATE.sessionId), ms));
    }

    function captureFrameToDataUrl() {
      const liveVideo = document.getElementById('liveVideo');
      const bgVideo = document.getElementById('bgVideo');
      const liveSim = document.getElementById('liveSimCanvas');
      const bgSim = document.getElementById('bgSimCanvas');

      let sourceEl = null;
      let isHardwareVideo = false;
      let srcW = 1280;
      let srcH = 720;

      if (liveVideo && liveVideo.readyState >= 2 && liveVideo.videoWidth > 0 && liveVideo.videoHeight > 0) {
        sourceEl = liveVideo;
        isHardwareVideo = true;
        srcW = liveVideo.videoWidth;
        srcH = liveVideo.videoHeight;
      } else if (bgVideo && bgVideo.readyState >= 2 && bgVideo.videoWidth > 0 && bgVideo.videoHeight > 0) {
        sourceEl = bgVideo;
        isHardwareVideo = true;
        srcW = bgVideo.videoWidth;
        srcH = bgVideo.videoHeight;
      } else if (liveSim && liveSim.width > 0 && liveSim.height > 0) {
        sourceEl = liveSim;
        srcW = liveSim.width;
        srcH = liveSim.height;
      } else if (bgSim && bgSim.width > 0 && bgSim.height > 0) {
        sourceEl = bgSim;
        srcW = bgSim.width;
        srcH = bgSim.height;
      } else {
        sourceEl = renderFallbackStudioFrame(1280, 720);
        srcW = sourceEl.width;
        srcH = sourceEl.height;
      }

      const maxDim = 1200;
      const scale = Math.min(1, maxDim / Math.max(srcW, srcH));
      const outW = Math.max(1, Math.round(srcW * scale));
      const outH = Math.max(1, Math.round(srcH * scale));

      const snapCanvas = document.createElement('canvas');
      snapCanvas.width = outW;
      snapCanvas.height = outH;
      const sctx = snapCanvas.getContext('2d');

      const shouldMirror = STATE.mirrorCamera && STATE.facingMode === 'user';
      if (shouldMirror) {
        sctx.translate(outW, 0);
        sctx.scale(-1, 1);
      }

      try {
        sctx.drawImage(sourceEl, 0, 0, outW, outH);
      } catch (err) {
        const safeFallback = renderFallbackStudioFrame(outW, outH);
        sctx.setTransform(1, 0, 0, 1, 0, 0);
        sctx.drawImage(safeFallback, 0, 0, outW, outH);
      }

      if (isHardwareVideo) STATE.hasLiveVideoStream = true;
      return snapCanvas.toDataURL('image/jpeg', 0.94);
    }

    function loadImageElement(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      const radius = Math.max(0, Math.min(r, w / 2, h / 2));
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    async function runCountdown(seconds, sessionToken) {
      closeFullScreenPreview();
      const overlay = document.getElementById('countdownOverlay');
      const numEl = document.getElementById('countdownNumber');
      if (!overlay || !numEl) return false;
      overlay.classList.remove('hidden');

      for (let s = seconds; s >= 1; s--) {
        if (sessionToken !== STATE.sessionId) {
          overlay.classList.add('hidden');
          return false;
        }
        numEl.textContent = String(s);
        numEl.classList.remove('count-pop');
        void numEl.offsetWidth;
        numEl.classList.add('count-pop');
        playCountdownTone(s === 1);

        const ok = await delayMs(1000, sessionToken);
        if (!ok) {
          overlay.classList.add('hidden');
          return false;
        }
      }

      overlay.classList.add('hidden');
      return true;
    }

    async function startPhotoSequence() {
      if (STATE.isCaptureRunning) return;
      STATE.isCaptureRunning = true;
      STATE.sessionId += 1;
      const sessionToken = STATE.sessionId;
      STATE.capturedPhotos = [];
      STATE.printCopies = 1;
      STATE.themeVariantSeed = (Date.now() % 900000) + Math.floor(Math.random() * 99999) + 1;
      updatePrintCopiesUI();

      const totalShots = STATE.shotCount === 4 ? 4 : 3;
      const counterEl = document.getElementById('captureShotCounter');

      closeCameraDiagnostics();
      setActiveScreen('capture');
      await ensureCameraReady(!STATE.hasLiveVideoStream);
      await unlockVideoPlaybackOnGesture();

      for (let shotIdx = 1; shotIdx <= totalShots; shotIdx++) {
        if (sessionToken !== STATE.sessionId) {
          STATE.isCaptureRunning = false;
          return;
        }

        if (counterEl) counterEl.textContent = `${shotIdx} / ${totalShots}`;

        const waitSec = shotIdx === 1 ? STATE.initialCountdownSec : STATE.betweenShotsSec;
        const completed = await runCountdown(waitSec, sessionToken);
        if (!completed || sessionToken !== STATE.sessionId) {
          STATE.isCaptureRunning = false;
          return;
        }

        triggerCameraFlash();
        playShutterSound();
        const rawPhotoDataUrl = captureFrameToDataUrl();
        const framedPhotoDataUrl = await cropDataUrlToTargetAspect(rawPhotoDataUrl, getActiveSlotAspectRatio());
        STATE.capturedPhotos.push(framedPhotoDataUrl);

        if (shotIdx < totalShots) {
          const ok = await delayMs(180, sessionToken);
          if (!ok) {
            STATE.isCaptureRunning = false;
            return;
          }
        }
      }

      if (sessionToken !== STATE.sessionId) {
        STATE.isCaptureRunning = false;
        return;
      }

      STATE.isCaptureRunning = false;
      setActiveScreen('print');
      await renderSelphyComposition();
    }

    function handleStartBoothClick(event) {
      if (event && typeof event.stopPropagation === 'function') event.stopPropagation();
      unlockVideoPlaybackOnGesture().catch(() => {});
      if (STATE.isStartingSequence || STATE.isCaptureRunning) return;
      STATE.isStartingSequence = true;
      announceKioskStatus(`بدء التقاط ${STATE.shotCount} صور`);
      try {
        startPhotoSequence().finally(() => { STATE.isStartingSequence = false; });
      } catch (err) {
        STATE.isStartingSequence = false;
      }
    }

    function dispatchButtonAction(buttonEl, event) {
      if (!buttonEl || buttonEl.disabled) return;
      const explicitAction = buttonEl.getAttribute('data-action');
      const btnId = buttonEl.id || '';

      if (explicitAction === 'select-shots' || buttonEl.classList.contains('shot-count-btn')) {
        const shots = Number(buttonEl.getAttribute('data-shots')) === 4 ? 4 : 3;
        selectShotCount(shots);
        announceKioskStatus(`تم اختيار ${shots} صور`);
        return;
      }

      if (explicitAction === 'select-layout' || buttonEl.classList.contains('home-layout-btn')) {
        const layoutId = buttonEl.getAttribute('data-layout');
        if (layoutId === 'postcard' || layoutId === 'dual_strip') {
          selectHomeLayout(layoutId);
          announceKioskStatus(layoutId === 'postcard' ? 'تم اختيار بوست كارت' : 'تم اختيار شريطين');
        }
        return;
      }

      if (explicitAction === 'start-capture' || btnId === 'startCaptureBtn') {
        handleStartBoothClick(event);
        return;
      }

      if (explicitAction === 'select-theme' || buttonEl.classList.contains('theme-pill-btn')) {
        const themeId = buttonEl.getAttribute('data-theme');
        if (themeId && THEMES[themeId]) {
          selectTheme(themeId);
          announceKioskStatus(`تم اختيار ثيم ${THEMES[themeId].label}`);
        }
        return;
      }

      if (explicitAction === 'change-copies') {
        const delta = Number(buttonEl.getAttribute('data-delta')) || 0;
        changePrintCopies(delta);
        const total = (Number(STATE.printCopies) || 1) * (Number(STATE.pricePerCopy) || 5000);
        announceKioskStatus(`عدد الطبعات ${STATE.printCopies} والمجموع ${total.toLocaleString('en-US')} دينار عراقي`);
        return;
      }

      if (explicitAction === 'open-fullscreen-preview' || btnId === 'btnOpenFullScreenPreview') {
        announceKioskStatus('فتح معاينة الطباعة الكاملة بدون قص', true);
        openFullScreenPreview();
        return;
      }

      if (explicitAction === 'download-image' || btnId === 'btnDownloadImage') {
        downloadComposedImage();
        return;
      }

      if (explicitAction === 'close-fullscreen-preview' || btnId === 'btnCloseFullScreenPreview') {
        closeFullScreenPreview();
        return;
      }

      if (explicitAction === 'direct-print' || btnId === 'btnDirectPrint') {
        announceKioskStatus('جاري الطباعة حسب قياس الطابعة بدون قص', true);
        triggerDirectPrint();
        return;
      }

      if (explicitAction === 'reset-kiosk' || btnId === 'btnFinishReset') {
        announceKioskStatus('تمت العودة إلى شاشة البداية');
        resetToStartScreen();
      }
    }

    function bindStartButtonEvents() {
      const appRoot = document.getElementById('app') || document.body;
      if (!appRoot || appRoot.dataset.kioskButtonsBound === '1') return;
      appRoot.dataset.kioskButtonsBound = '1';

      const recentActivations = new WeakMap();
      const activateOnce = (buttonEl, event) => {
        if (!buttonEl) return;
        const now = Date.now();
        const lastAt = recentActivations.get(buttonEl) || 0;
        if (now - lastAt < 380) return;
        recentActivations.set(buttonEl, now);
        dispatchButtonAction(buttonEl, event);
      };

      appRoot.addEventListener('touchend', (event) => {
        if (event.touches && event.touches.length > 0) return;
        const target = event.target && event.target.closest ? event.target.closest('button, [role="button"]') : null;
        if (!target || !appRoot.contains(target)) return;
        if (event.cancelable) event.preventDefault();
        activateOnce(target, event);
      }, { passive: false });

      appRoot.addEventListener('click', (event) => {
        const target = event.target && event.target.closest ? event.target.closest('button, [role="button"]') : null;
        if (!target || !appRoot.contains(target)) return;
        activateOnce(target, event);
      });
    }

    function createSeededRng(seedVal) {
      let s = (Number(seedVal) || 1) % 2147483647;
      if (s <= 0) s += 2147483646;
      return () => {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function drawCuteStar(ctx, cx, cy, outerR, innerR, color) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const angle = -Math.PI / 2 + (i * Math.PI) / 5;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawCuteHeart(ctx, cx, cy, size, color) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(cx, cy + topCurveHeight);
      ctx.bezierCurveTo(cx, cy, cx - size / 2, cy, cx - size / 2, cy + topCurveHeight);
      ctx.bezierCurveTo(cx - size / 2, cy + (size + topCurveHeight) / 2, cx, cy + (size + topCurveHeight) / 1.25, cx, cy + size);
      ctx.bezierCurveTo(cx, cy + (size + topCurveHeight) / 1.25, cx + size / 2, cy + (size + topCurveHeight) / 2, cx + size / 2, cy + topCurveHeight);
      ctx.bezierCurveTo(cx + size / 2, cy, cx, cy, cx, cy + topCurveHeight);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawCuteFlower(ctx, cx, cy, r, petalColor, centerColor) {
      ctx.save();
      for (let i = 0; i < 6; i++) {
        const angle = (i * Math.PI) / 3;
        const px = cx + Math.cos(angle) * (r * 0.65);
        const py = cy + Math.sin(angle) * (r * 0.65);
        ctx.fillStyle = petalColor;
        ctx.beginPath();
        ctx.arc(px, py, r * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = centerColor;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.36, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawCuteSparkle(ctx, cx, cy, r, color) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(cx, cy - r);
      ctx.quadraticCurveTo(cx, cy, cx + r, cy);
      ctx.quadraticCurveTo(cx, cy, cx, cy + r);
      ctx.quadraticCurveTo(cx, cy, cx - r, cy);
      ctx.quadraticCurveTo(cx, cy, cx, cy - r);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawCuteBalloon(ctx, cx, cy, scale, fillColor, stringColor) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.strokeStyle = stringColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 22);
      ctx.quadraticCurveTo(-8, 34, 2, 46);
      ctx.stroke();

      ctx.fillStyle = fillColor;
      ctx.beginPath();
      ctx.ellipse(0, 0, 17, 22, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.beginPath();
      ctx.ellipse(-5, -7, 4.5, 7, -0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawCuteCrown(ctx, cx, cy, scale, color) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-20, 10);
      ctx.lineTo(-22, -10);
      ctx.lineTo(-9, 1);
      ctx.lineTo(0, -14);
      ctx.lineTo(9, 1);
      ctx.lineTo(22, -10);
      ctx.lineTo(20, 10);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawThemeBackground(ctx, theme, width, height, variantSeed = 0) {
      const rng = createSeededRng(variantSeed + theme.id.split('').reduce((a, b) => a + b.charCodeAt(0) * 31, 17));
      const grad = ctx.createLinearGradient(0, 0, width * 0.25, height);
      grad.addColorStop(0, theme.bgTop);
      grad.addColorStop(1, theme.bgBottom);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      const safeInsetX = Math.max(44, Math.round(width * 0.05));
      const safeInsetY = Math.max(48, Math.round(height * 0.032));
      const frameX = safeInsetX;
      const frameY = safeInsetY;
      const frameW = Math.max(120, width - safeInsetX * 2);
      const frameH = Math.max(220, height - safeInsetY * 2);

      const footerInnerPad = Math.max(14, Math.round(height * 0.012));
      const footerZoneH = Math.max(76, Math.min(126, Math.round(frameH * 0.072)));
      const footerRect = {
        x: frameX + Math.max(16, Math.round(frameW * 0.035)),
        y: frameY + frameH - footerZoneH - footerInnerPad,
        w: Math.max(80, frameW - Math.max(32, Math.round(frameW * 0.07))),
        h: footerZoneH
      };

      const puffCount = 5 + Math.floor(rng() * 4);
      for (let p = 0; p < puffCount; p++) {
        const px = frameX + rng() * Math.max(40, frameW);
        const py = frameY + rng() * Math.max(40, frameH);
        const pr = Math.max(60, Math.min(width, height) * (0.11 + rng() * 0.11));
        const puffGrad = ctx.createRadialGradient(px, py, 8, px, py, pr);
        puffGrad.addColorStop(0, `${theme.borderColor}26`);
        puffGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = puffGrad;
        ctx.beginPath();
        ctx.arc(px, py, pr, 0, Math.PI * 2);
        ctx.fill();
      }

      const itemCount = 12 + Math.floor(rng() * 6);
      for (let i = 0; i < itemCount; i++) {
        const x = frameX + 20 + rng() * Math.max(40, frameW - 40);
        const y = frameY + 24 + rng() * Math.max(40, frameH - 48);
        const scale = 0.65 + rng() * 0.75;
        const rot = (rng() - 0.5) * 0.55;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);

        if (theme.pattern === 'stars') {
          const mode = i % 3;
          if (mode === 0) drawCuteStar(ctx, 0, 0, 20 * scale, 9 * scale, 'rgba(245, 158, 11, 0.28)');
          else if (mode === 1) drawCuteBalloon(ctx, 0, 0, 0.8 * scale, 'rgba(56, 189, 248, 0.26)', 'rgba(245, 158, 11, 0.35)');
          else drawCuteSparkle(ctx, 0, 0, 17 * scale, 'rgba(251, 146, 60, 0.26)');
        } else if (theme.pattern === 'hearts') {
          if (i % 3 === 0) drawCuteHeart(ctx, 0, 0, 26 * scale, 'rgba(236, 72, 153, 0.25)');
          else if (i % 3 === 1) drawCuteFlower(ctx, 0, 0, 19 * scale, 'rgba(244, 114, 182, 0.25)', 'rgba(253, 224, 71, 0.35)');
          else drawCuteSparkle(ctx, 0, 0, 19 * scale, 'rgba(244, 63, 94, 0.24)');
        } else if (theme.pattern === 'neon') {
          if (i % 2 === 0) drawCuteSparkle(ctx, 0, 0, 20 * scale, 'rgba(34, 211, 238, 0.28)');
          else drawCuteStar(ctx, 0, 0, 18 * scale, 8 * scale, 'rgba(96, 165, 250, 0.26)');
        } else if (theme.pattern === 'gold') {
          if (i % 3 === 0) drawCuteCrown(ctx, 0, 0, 0.8 * scale, 'rgba(250, 204, 21, 0.25)');
          else drawCuteSparkle(ctx, 0, 0, 20 * scale, 'rgba(250, 204, 21, 0.25)');
        } else if (theme.pattern === 'pastel') {
          if (i % 2 === 0) drawCuteFlower(ctx, 0, 0, 22 * scale, 'rgba(192, 132, 252, 0.28)', 'rgba(251, 191, 36, 0.35)');
          else drawCuteHeart(ctx, 0, 0, 22 * scale, 'rgba(52, 211, 153, 0.24)');
        } else {
          if (i % 3 === 0) drawCuteCrown(ctx, 0, 0, 0.76 * scale, 'rgba(197, 160, 89, 0.24)');
          else drawCuteSparkle(ctx, 0, 0, 18 * scale, 'rgba(197, 160, 89, 0.26)');
        }
        ctx.restore();
      }

      ctx.save();
      ctx.strokeStyle = theme.borderColor;
      ctx.lineWidth = Math.max(6, Math.round(width * 0.0075));
      roundRectPath(ctx, frameX, frameY, frameW, frameH, 28);
      ctx.stroke();
      ctx.restore();

      return {
        frameRect: { x: frameX, y: frameY, w: frameW, h: frameH },
        footerRect
      };
    }

    function drawFooterCaptionCleanly(ctx, theme, text, footerRect, baseFontSize) {
      if (!ctx || !footerRect || footerRect.w <= 10 || footerRect.h <= 10) return;
      ctx.save();
      roundRectPath(ctx, footerRect.x, footerRect.y, footerRect.w, footerRect.h, 18);
      ctx.fillStyle = theme.matColor || 'rgba(255, 255, 255, 0.75)';
      ctx.globalAlpha = 0.72;
      ctx.fill();
      ctx.globalAlpha = 1;

      const maxTextW = Math.max(50, footerRect.w - 28);
      let fontSize = Math.min(baseFontSize, Math.round(footerRect.h * 0.46));
      ctx.font = `800 ${fontSize}px Cairo, sans-serif`;
      while (fontSize > 14 && ctx.measureText(text).width > maxTextW) {
        fontSize -= 2;
        ctx.font = `800 ${fontSize}px Cairo, sans-serif`;
      }

      ctx.fillStyle = theme.textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, footerRect.x + footerRect.w * 0.5, footerRect.y + footerRect.h * 0.5 + 1);
      ctx.restore();
    }

    function drawThemeStickersOverPhotos(ctx, theme, photoRects, variantSeed = 0) {
      if (!ctx || !theme || !Array.isArray(photoRects) || photoRects.length === 0) return;
      const palette = Array.isArray(theme.overlayStickers) && theme.overlayStickers.length > 0
        ? theme.overlayStickers
        : [theme.stickerLeft, theme.stickerRight, '✨'];

      photoRects.forEach((rect, idx) => {
        if (!rect || rect.w <= 20 || rect.h <= 20) return;
        const rng = createSeededRng(variantSeed + idx * 977 + theme.id.charCodeAt(0) * 131);
        const cornerChoices = [
          { x: rect.x + 18, y: rect.y + 18 },
          { x: rect.x + rect.w - 18, y: rect.y + 18 },
          { x: rect.x + 18, y: rect.y + rect.h - 18 },
          { x: rect.x + rect.w - 18, y: rect.y + rect.h - 18 }
        ];

        const firstIdx = Math.floor(rng() * cornerChoices.length);
        let secondIdx = Math.floor(rng() * cornerChoices.length);
        if (secondIdx === firstIdx) secondIdx = (firstIdx + 2) % cornerChoices.length;

        [firstIdx, secondIdx].forEach((cIdx, sPos) => {
          const spot = cornerChoices[cIdx];
          const stickerChar = palette[Math.floor(rng() * palette.length)];
          const fontPx = Math.max(24, Math.min(54, Math.round(Math.min(rect.w, rect.h) * (0.12 + rng() * 0.04))));
          const angle = (rng() - 0.5) * 0.52;
          const jitterX = (rng() - 0.5) * 8;
          const jitterY = (rng() - 0.5) * 8;

          ctx.save();
          ctx.translate(spot.x + jitterX, spot.y + jitterY + (sPos === 1 ? 2 : 0));
          ctx.rotate(angle);
          ctx.font = `900 ${fontPx}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", Cairo, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(255, 255, 255, 0.85)';
          ctx.shadowBlur = 10;
          ctx.fillText(stickerChar, 0, 0);
          ctx.restore();
        });
      });
    }

    function renderSingleStrip(ctx, theme, captions, images, stripX, stripY, stripW, stripH, variantSeed = 0) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(stripX, stripY, stripW, stripH);
      ctx.clip();

      const tempCan = document.createElement('canvas');
      tempCan.width = stripW;
      tempCan.height = stripH;
      const tctx = tempCan.getContext('2d');
      const { frameRect, footerRect } = drawThemeBackground(tctx, theme, stripW, stripH, variantSeed);
      ctx.drawImage(tempCan, stripX, stripY);

      const padX = Math.max(24, Math.round(stripW * 0.085));
      const topPad = frameRect.y + Math.round(stripH * 0.022);
      const bottomLimit = stripY + footerRect.y - Math.round(stripH * 0.016);
      const gap = Math.round(stripH * 0.012);
      const count = images.length;
      const availH = Math.max(90, bottomLimit - topPad - gap * (count - 1));
      const photoH = availH / count;
      const photoW = Math.max(60, stripW - padX * 2);
      const centeredX = stripX + Math.round((stripW - photoW) * 0.5);
      const drawnPhotoRects = [];

      for (let i = 0; i < count; i++) {
        const py = topPad + i * (photoH + gap);
        drawPhotoFittedInRect(ctx, images[i], centeredX, py, photoW, photoH, {
          borderColor: theme.accentColor,
          borderWidth: 3.5,
          radius: 16
        });
        drawnPhotoRects.push({ x: centeredX, y: py, w: photoW, h: photoH });
      }

      drawThemeStickersOverPhotos(ctx, theme, drawnPhotoRects, variantSeed + 313);

      drawFooterCaptionCleanly(
        ctx,
        theme,
        `${theme.stickerLeft} ${captions.bottomCaption} ${theme.stickerRight}`,
        {
          x: stripX + footerRect.x,
          y: stripY + footerRect.y,
          w: footerRect.w,
          h: footerRect.h
        },
        Math.round(stripW * 0.042)
      );

      ctx.restore();
    }

    async function renderSelphyComposition() {
      const canvas = document.getElementById('selphyCanvas');
      if (!canvas) return;
      canvas.width = 1200;
      canvas.height = 1800;

      const ctx = canvas.getContext('2d');
      const theme = THEMES[STATE.selectedTheme] || THEMES.kids;
      const variantSeed = STATE.themeVariantSeed || 1;
      const captions = getThemeCaptions(theme, variantSeed);

      const sources = STATE.capturedPhotos.length > 0
        ? STATE.capturedPhotos
        : [captureFrameToDataUrl()];

      const loadedImages = [];
      for (let i = 0; i < sources.length; i++) {
        try {
          const img = await loadImageElement(sources[i]);
          loadedImages.push(img);
        } catch (err) {}
      }

      if (loadedImages.length === 0) {
        const fallbackCanvas = document.createElement('canvas');
        fallbackCanvas.width = 1200;
        fallbackCanvas.height = 1800;
        const fctx = fallbackCanvas.getContext('2d');
        fctx.fillStyle = '#1e293b';
        fctx.fillRect(0, 0, 1200, 1800);
        const fallbackImg = await loadImageElement(fallbackCanvas.toDataURL('image/jpeg'));
        loadedImages.push(fallbackImg);
      }

      const W = canvas.width;
      const H = canvas.height;

      if (STATE.printLayout === 'dual_strip') {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, W, H);

        renderSingleStrip(ctx, theme, captions, loadedImages, 0, 0, W * 0.5, H, variantSeed);
        renderSingleStrip(ctx, theme, captions, loadedImages, W * 0.5, 0, W * 0.5, H, variantSeed + 97);

        ctx.save();
        ctx.setLineDash([12, 10]);
        ctx.strokeStyle = 'rgba(100, 116, 139, 0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(W * 0.5, Math.round(H * 0.04));
        ctx.lineTo(W * 0.5, H - Math.round(H * 0.04));
        ctx.stroke();
        ctx.restore();
      } else {
        const { frameRect, footerRect } = drawThemeBackground(ctx, theme, W, H, variantSeed);

        const topHeaderSpace = Math.round(H * 0.072);
        const innerSidePad = Math.round(frameRect.w * 0.045);
        const count = loadedImages.length;
        const drawnPhotoRects = [];

        ctx.fillStyle = theme.textColor;
        const headerFontPx = Math.max(24, Math.round(W * 0.031));
        ctx.font = `900 ${headerFontPx}px Cairo, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(
          `${theme.stickerLeft}  ${captions.topCaption}  ${theme.stickerRight}`,
          W * 0.5,
          frameRect.y + topHeaderSpace * 0.55
        );

        const photosTopY = frameRect.y + topHeaderSpace + Math.round(H * 0.008);
        const photosBottomY = footerRect.y - Math.round(H * 0.016);
        const availPhotosH = Math.max(120, photosBottomY - photosTopY);
        const fullContentW = Math.max(120, frameRect.w - innerSidePad * 2);

        if (count === 4) {
          const cols = 2;
          const rows = 2;
          const gapX = Math.round(W * 0.024);
          const gapY = Math.round(H * 0.016);
          const cellW = (fullContentW - gapX) / cols;
          const cellH = Math.max(60, (availPhotosH - gapY) / rows);
          const gridTotalW = cellW * cols + gapX;
          const gridStartX = Math.round((W - gridTotalW) * 0.5);

          for (let i = 0; i < 4; i++) {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const x = gridStartX + col * (cellW + gapX);
            const y = photosTopY + row * (cellH + gapY);
            drawPhotoFittedInRect(ctx, loadedImages[i], x, y, cellW, cellH, {
              borderColor: theme.accentColor,
              borderWidth: 4.5,
              radius: 22
            });
            drawnPhotoRects.push({ x, y, w: cellW, h: cellH });
          }
        } else {
          const gap = Math.round(H * 0.015);
          const cellH = Math.max(70, (availPhotosH - gap * (count - 1)) / count);
          const cellW = fullContentW;
          const centeredX = Math.round((W - cellW) * 0.5);

          for (let i = 0; i < count; i++) {
            const y = photosTopY + i * (cellH + gap);
            drawPhotoFittedInRect(ctx, loadedImages[i], centeredX, y, cellW, cellH, {
              borderColor: theme.accentColor,
              borderWidth: 4.5,
              radius: 22
            });
            drawnPhotoRects.push({ x: centeredX, y, w: cellW, h: cellH });
          }
        }

        drawThemeStickersOverPhotos(ctx, theme, drawnPhotoRects, variantSeed + 509);

        drawFooterCaptionCleanly(
          ctx,
          theme,
          `${theme.stickerLeft}  ${captions.bottomCaption}  ${theme.stickerRight}`,
          footerRect,
          Math.max(22, Math.round(W * 0.029))
        );
      }

      const dataUrl = canvas.toDataURL('image/jpeg', 0.96);
      const previewImg = document.getElementById('composedPreviewImg');
      const fullScreenImg = document.getElementById('fullScreenComposedImg');
      const printImg = document.getElementById('printOnlyImg');
      if (previewImg) previewImg.src = dataUrl;
      if (fullScreenImg) fullScreenImg.src = dataUrl;
      if (printImg) printImg.src = dataUrl;
      syncFullScreenPreviewMeta();
    }

    async function selectTheme(themeId) {
      if (!THEMES[themeId]) return;
      STATE.selectedTheme = themeId;
      const prevClick = Number(STATE.themeCaptionClickIndex[themeId] || 0);
      STATE.themeCaptionClickIndex[themeId] = prevClick + 1;
      STATE.themeVariantSeed = ((Number(STATE.themeVariantSeed) || 1) + 7919 + Math.floor(Math.random() * 997)) % 1000000;

      document.querySelectorAll('.theme-pill-btn').forEach((btn) => {
        const isSelected = btn.getAttribute('data-theme') === themeId;
        btn.className = isSelected
          ? 'theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-indigo-600/35 border-amber-300 text-white shadow'
          : 'theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-white/35 text-slate-200';
      });

      if (STATE.screen === 'print') {
        await renderSelphyComposition();
      }
    }

    function updatePrintCopiesUI() {
      const copies = Math.max(1, Number(STATE.printCopies) || 1);
      const unitPrice = Number(STATE.pricePerCopy) || 5000;
      const totalPrice = copies * unitPrice;
      const formattedTotal = `${totalPrice.toLocaleString('en-US')} د.ع`;

      const countEl = document.getElementById('printCopiesValue');
      const totalEl = document.getElementById('printTotalPriceLabel');
      const printBtnLabel = document.getElementById('btnDirectPrintLabel');

      if (countEl) countEl.textContent = String(copies);
      if (totalEl) totalEl.textContent = `المجموع: ${formattedTotal}`;
      if (printBtnLabel) printBtnLabel.textContent = `طباعة فورية حسب الطابعة (${copies}) — ${formattedTotal}`;
    }

    function changePrintCopies(delta) {
      const next = Math.max(1, Math.min(20, (Number(STATE.printCopies) || 1) + Number(delta || 0)));
      STATE.printCopies = next;
      updatePrintCopiesUI();
    }

    async function downloadComposedImage() {
      await renderSelphyComposition();
      const canvas = document.getElementById('selphyCanvas');
      if (!canvas) return;
      const dataUrl = canvas.toDataURL('image/jpeg', 0.98);
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = `PRINTER_FIT_NO_CROP_${Date.now()}.jpg`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      announceKioskStatus('تم حفظ الصورة الكاملة بدون قص', true);
    }

    async function triggerDirectPrint() {
      applyPrinterPageRule();
      await renderSelphyComposition();
      try {
        window.print();
      } catch (err) {}
    }

    function syncFullScreenPreviewMeta() {
      const metaEl = document.getElementById('fullScreenPreviewMeta');
      const fsPrintBtnLabel = document.getElementById('btnFullScreenPrintLabel');
      const themeObj = THEMES[STATE.selectedTheme] || THEMES.kids;
      const layoutLabel = STATE.printLayout === 'postcard' ? 'بوست كارت' : 'شريطين';
      const copies = Math.max(1, Number(STATE.printCopies) || 1);
      const total = copies * (Number(STATE.pricePerCopy) || 5000);
      if (metaEl) metaEl.textContent = `${STATE.shotCount} صور • ${layoutLabel} • ثيم ${themeObj.label} • ${copies} نسخة`;
      if (fsPrintBtnLabel) fsPrintBtnLabel.textContent = `طباعة فورية (${copies}) — ${total.toLocaleString('en-US')} د.ع`;
    }

    async function openFullScreenPreview() {
      applyPrinterPageRule();
      await renderSelphyComposition();
      syncFullScreenPreviewMeta();
      const modal = document.getElementById('fullScreenPreviewModal');
      if (modal) modal.classList.remove('hidden');
    }

    function closeFullScreenPreview() {
      const modal = document.getElementById('fullScreenPreviewModal');
      if (modal) modal.classList.add('hidden');
    }

    async function resetToStartScreen() {
      STATE.sessionId += 1;
      STATE.isCaptureRunning = false;
      STATE.isStartingSequence = false;
      STATE.capturedPhotos = [];
      STATE.printCopies = 1;
      updatePrintCopiesUI();

      const overlay = document.getElementById('countdownOverlay');
      if (overlay) overlay.classList.add('hidden');

      setActiveScreen('start');
      syncHomeSelectionButtons();
      await ensureCameraReady(false);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      installViewportLocks();
      bindStartButtonEvents();
      startSimulatedCameraLoop();
      syncHomeSelectionButtons();
      await selectTheme('kids');
      updatePrintCopiesUI();
      await ensureCameraReady(false);

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) ensureCameraReady(!STATE.hasLiveVideoStream).catch(() => {});
      });

      const resumeVideoOnGesture = () => {
        if (STATE.stream) {
          attachStreamToVideos(STATE.stream);
          unlockVideoPlaybackOnGesture().catch(() => {});
        } else if (!STATE.hasLiveVideoStream) {
          ensureCameraReady(false).catch(() => {});
        }
      };

      document.addEventListener('pointerdown', resumeVideoOnGesture, { passive: true });
      document.addEventListener('click', resumeVideoOnGesture, { passive: true });
      window.addEventListener('resize', () => syncCameraVisualTargets());
    });
  </script>
