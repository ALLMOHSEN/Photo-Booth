<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>فوتو بوث الذكريات | Canon SELPHY</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Arabic Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* Strict Kiosk Lock: prevent zoom, pan, bounce, selection, and callouts */
    html, body {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: 'Cairo', sans-serif;
      background-color: #050814;
      color: #f8fafc;
    }

    button, [role="button"] {
      touch-action: manipulation;
      cursor: pointer;
    }

    /* Ambient blurred live background on Screen 1 */
    .ambient-video-blur {
      filter: blur(14px) brightness(0.72);
      transform: scale(1.08);
    }

    .ambient-video-blur.mirrored {
      transform: scaleX(-1) scale(1.08);
    }

    /* Clear live camera feed on Screen 2 */
    .live-camera-feed {
      filter: blur(0px) brightness(1);
      transform: scale(1);
    }

    .live-camera-feed.mirrored {
      transform: scaleX(-1);
    }

    /* Subtle pulse for primary Kiosk start button */
    @keyframes kioskPulse {
      0%, 100% {
        box-shadow: 0 0 35px rgba(99, 102, 241, 0.55), 0 0 75px rgba(236, 72, 153, 0.28);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 50px rgba(99, 102, 241, 0.8), 0 0 100px rgba(236, 72, 153, 0.45);
        transform: scale(1.02);
      }
    }

    .start-btn-glow {
      animation: kioskPulse 2.8s infinite ease-in-out;
    }

    /* Camera flash overlay animation */
    @keyframes flashBurst {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    .flash-burst {
      animation: flashBurst 0.45s ease-out forwards;
    }

    /* Countdown number entrance */
    @keyframes countPop {
      0% { transform: scale(0.45); opacity: 0; }
      35% { transform: scale(1.12); opacity: 1; }
      85% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.85); opacity: 0; }
    }

    .count-pop {
      animation: countPop 0.9s ease-in-out forwards;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* Print-only container hidden on screen */
    #printOnlyContainer {
      display: none;
    }

    /* Exact 100mm x 148mm / 4in x 6in borderless print stylesheet for Canon SELPHY */
    @page {
      size: 100mm 148mm;
      margin: 0;
    }

    @media print {
      @page {
        size: 100mm 148mm;
        margin: 0 !important;
      }

      html, body {
        width: 100mm !important;
        height: 148mm !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        background: #ffffff !important;
      }

      body > *:not(#printOnlyContainer) {
        display: none !important;
      }

      #printOnlyContainer {
        display: block !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100mm !important;
        height: 148mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        z-index: 999999 !important;
      }

      #printOnlyImg {
        width: 100mm !important;
        height: 148mm !important;
        max-width: none !important;
        max-height: none !important;
        object-fit: fill !important;
        display: block !important;
      }
    }
  </style>
</head>
<body class="relative select-none overflow-hidden">

  <!-- Full-screen flash overlay on photo capture -->
  <div id="flashOverlay" class="fixed inset-0 bg-white pointer-events-none opacity-0 z-50"></div>

  <!-- Print-only full-bleed 100mm x 148mm output -->
  <div id="printOnlyContainer" aria-hidden="true">
    <img id="printOnlyImg" alt="Canon SELPHY 4x6 Print" />
  </div>

  <!-- Toast notification banner -->
  <div id="statusToast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300 px-3 max-w-full">
    <div id="statusToastText" class="px-5 py-2.5 rounded-2xl bg-slate-900/95 border border-emerald-400/40 text-white text-xs sm:text-sm font-extrabold shadow-2xl text-center"></div>
  </div>

  <!-- ===================================================================== -->
  <!-- SCREEN 1: START KIOSK (Blurred Live Camera BG + Single Center CTA)   -->
  <!-- ===================================================================== -->
  <section id="screenStart" class="relative w-full h-full flex items-center justify-center p-4 sm:p-6 overflow-hidden">
    <!-- Live Camera Background + Simulated Fallback Canvas -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
      <video id="bgVideo" autoplay playsinline muted class="w-full h-full object-cover ambient-video-blur mirrored hidden"></video>
      <canvas id="bgSimCanvas" width="1280" height="720" class="w-full h-full object-cover ambient-video-blur"></canvas>
      <!-- Dark vignette overlay -->
      <div class="fixed inset-0 bg-gradient-to-b from-slate-950/55 via-slate-950/35 to-slate-950/65"></div>
    </div>

    <!-- Subtle camera mode badge -->
    <div id="startCameraBadge" class="fixed top-4 right-4 z-20 px-3.5 py-1.5 rounded-full bg-black/55 border border-white/15 text-[11px] sm:text-xs font-bold text-slate-200 pointer-events-none">
      جاري فحص الكاميرا...
    </div>

    <!-- Single Centered CTA Button -->
    <div class="relative z-10 w-full max-w-xl flex items-center justify-center">
      <button
        id="btnStartBooth"
        type="button"
        onclick="handleStartBoothClick()"
        class="start-btn-glow w-full sm:w-auto sm:min-w-[400px] px-8 py-9 sm:px-12 sm:py-11 rounded-[2.25rem] bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:via-purple-500 hover:to-pink-500 active:scale-95 text-white border-2 border-white/25 transition-all duration-200 flex flex-col items-center justify-center gap-3"
      >
        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-white/15 flex items-center justify-center shadow-inner">
          <svg class="w-9 h-9 sm:w-11 sm:h-11 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <circle cx="12" cy="13" r="3.5" />
          </svg>
        </div>
        <span class="text-2xl sm:text-4xl font-black tracking-tight text-center leading-snug">
          أخذ صورة ذكرى بسعر 5,000
        </span>
      </button>
    </div>
  </section>

  <!-- ===================================================================== -->
  <!-- SCREEN 2: LIVE CAPTURE & COUNTDOWN (6s Initial -> 3s Between Shots)  -->
  <!-- ===================================================================== -->
  <section id="screenCapture" class="hidden relative w-full h-full bg-black flex items-center justify-center overflow-hidden">
    <!-- Clear Live Camera Video or Simulated Camera Canvas -->
    <video id="liveVideo" autoplay playsinline muted class="w-full h-full object-cover live-camera-feed mirrored hidden"></video>
    <canvas id="liveSimCanvas" width="1280" height="720" class="w-full h-full object-cover live-camera-feed"></canvas>

    <!-- Top bar: Shot counter + captured thumbnails + mode indicator -->
    <div class="fixed top-4 inset-x-4 z-20 flex items-center justify-between gap-2 pointer-events-none">
      <div class="flex items-center gap-2">
        <span id="shotProgressBadge" class="px-4 py-2 rounded-full bg-black/65 border border-white/20 text-white text-xs sm:text-sm font-black shadow-lg">
          الصورة 1 من 3
        </span>
        <span id="captureModeBadge" class="hidden px-3 py-1.5 rounded-full bg-amber-500/25 border border-amber-300/40 text-amber-200 text-[11px] font-bold">
          وضع الكاميرا الافتراضية
        </span>
      </div>

      <div id="capturedThumbnails" class="flex items-center gap-1.5 sm:gap-2"></div>
    </div>

    <!-- Center Countdown Overlay -->
    <div id="countdownOverlay" class="fixed inset-0 z-20 bg-black/25 flex flex-col items-center justify-center px-4 text-center pointer-events-none">
      <div id="countdownLabel" class="mb-2 px-5 py-1.5 rounded-full bg-black/65 border border-white/20 text-amber-300 text-lg sm:text-2xl font-black shadow-lg">
        استعد للتصوير...
      </div>
      <div id="countdownNumber" class="text-[8rem] sm:text-[12rem] leading-none font-black text-white drop-shadow-[0_10px_30px_rgba(99,102,241,0.95)]">
        6
      </div>
    </div>
  </section>

  <!-- ===================================================================== -->
  <!-- SCREEN 3: FIXED THEME PICKER (4 THEMES) & DIRECT CANON SELPHY PRINT   -->
  <!-- ===================================================================== -->
  <section id="screenPrint" class="hidden relative w-full h-full p-3 sm:p-5 lg:p-6 flex flex-col lg:flex-row gap-4 lg:gap-6 items-stretch justify-center overflow-hidden">
    <!-- Left / Right Preview Column: 4x6 Canon SELPHY Composition -->
    <div class="lg:w-1/2 h-[45%] lg:h-full glass-panel rounded-3xl p-3 sm:p-5 flex flex-col items-center justify-center relative overflow-hidden">
      <img
        id="composedPreviewImg"
        alt="معاينة الصورة النهائية 4x6"
        class="max-h-full w-auto rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.85)] border-2 border-white/20 object-contain"
      />
      <span class="absolute top-3 left-3 px-3 py-1 rounded-full bg-black/70 border border-emerald-400/35 text-[11px] font-extrabold text-emerald-300">
        Canon SELPHY • 100×148mm (4×6")
      </span>
    </div>

    <!-- Controls Column: Fixed 4 Themes + Direct Print + Reset -->
    <div class="lg:w-1/2 h-[55%] lg:h-full glass-panel rounded-3xl p-4 sm:p-6 flex flex-col justify-between gap-3 overflow-hidden">
      <div>
        <h2 class="text-lg sm:text-2xl font-black text-white mb-3">اختر الثيم</h2>

        <!-- Fixed 4 Themes Grid: أطفال / بنات / أولاد / كبار -->
        <div id="fixedThemesGrid" class="grid grid-cols-2 gap-2.5 sm:gap-3">
          <button
            type="button"
            data-theme="kids"
            onclick="selectFixedTheme('kids')"
            class="theme-card-btn p-3.5 sm:p-4 rounded-2xl border-2 text-right transition flex items-center gap-3 bg-gradient-to-br from-amber-500/25 to-orange-600/25 border-amber-400 text-white shadow-lg"
          >
            <span class="text-2xl sm:text-3xl leading-none">🧸</span>
            <span class="text-base sm:text-xl font-black">أطفال</span>
          </button>

          <button
            type="button"
            data-theme="girls"
            onclick="selectFixedTheme('girls')"
            class="theme-card-btn p-3.5 sm:p-4 rounded-2xl border-2 text-right transition flex items-center gap-3 bg-slate-900/75 border-white/15 hover:border-pink-400/60 text-slate-200"
          >
            <span class="text-2xl sm:text-3xl leading-none">👑</span>
            <span class="text-base sm:text-xl font-black">بنات</span>
          </button>

          <button
            type="button"
            data-theme="boys"
            onclick="selectFixedTheme('boys')"
            class="theme-card-btn p-3.5 sm:p-4 rounded-2xl border-2 text-right transition flex items-center gap-3 bg-slate-900/75 border-white/15 hover:border-cyan-400/60 text-slate-200"
          >
            <span class="text-2xl sm:text-3xl leading-none">🚀</span>
            <span class="text-base sm:text-xl font-black">أولاد</span>
          </button>

          <button
            type="button"
            data-theme="adults"
            onclick="selectFixedTheme('adults')"
            class="theme-card-btn p-3.5 sm:p-4 rounded-2xl border-2 text-right transition flex items-center gap-3 bg-slate-900/75 border-white/15 hover:border-yellow-400/60 text-slate-200"
          >
            <span class="text-2xl sm:text-3xl leading-none">✨</span>
            <span class="text-base sm:text-xl font-black">كبار</span>
          </button>
        </div>
      </div>

      <!-- Primary Print & Reset Actions -->
      <div class="flex flex-col gap-2.5 pt-2 border-t border-white/10">
        <button
          id="btnDirectPrint"
          type="button"
          onclick="triggerDirectPrint()"
          class="w-full py-4 px-5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 active:scale-[0.98] text-white font-black text-base sm:text-xl shadow-xl shadow-emerald-600/30 transition flex items-center justify-center gap-2.5"
        >
          <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          <span>طباعة فورية — الاستلام من الكاشير</span>
        </button>

        <button
          id="btnFinishReset"
          type="button"
          onclick="resetToStartScreen()"
          class="w-full py-3.5 px-5 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-[0.98] border border-white/15 text-slate-100 font-extrabold text-sm sm:text-base transition flex items-center justify-center gap-2"
        >
          <span>إنهاء والعودة</span>
        </button>
      </div>
    </div>
  </section>

  <!-- High-resolution 1200x1800 px (300 DPI at 4x6 inch / 100x148 mm) offscreen print canvas -->
  <canvas id="selphyCanvas" width="1200" height="1800" class="hidden"></canvas>

  <script>
    /**
     * Kiosk State & Configuration
     */
    const STATE = {
      screen: 'start',          // 'start' | 'capture' | 'print'
      shotCount: 3,             // Default 3 photos in vertical 4x6 composition
      initialCountdownSec: 6,   // 6s before first photo
      betweenShotsSec: 3,       // 3s between subsequent photos
      selectedTheme: 'kids',    // 'kids' | 'girls' | 'boys' | 'adults'
      mirrorCamera: true,
      stream: null,
      hasLiveVideoStream: false,
      simulatedMode: false,
      capturedPhotos: [],       // Data URLs for each captured frame
      isCaptureRunning: false,
      sessionId: 0,             // Incrementing token to cancel stale async loops on reset
      simAnimFrame: null
    };

    /**
     * 4 Fixed Themes definitions for 1200x1800 Canon SELPHY Canvas
     */
    const FIXED_THEMES = {
      kids: {
        id: 'kids',
        title: 'ذكرى أطفال سعيدة',
        subtitle: 'عالم المرح والنجوم 🎈⭐',
        bgTop: '#FFFBEB',
        bgBottom: '#FEF3C7',
        borderColor: '#F59E0B',
        accentColor: '#EC4899',
        textColor: '#92400E',
        stickerLeft: '🧸',
        stickerRight: '🎈',
        pattern: 'confetti'
      },
      girls: {
        id: 'girls',
        title: 'أجمل الذكريات',
        subtitle: 'تاج الأميرات والورود 👑💖',
        bgTop: '#FFF1F2',
        bgBottom: '#FFE4E6',
        borderColor: '#E11D48',
        accentColor: '#F59E0B',
        textColor: '#881337',
        stickerLeft: '👑',
        stickerRight: '🌸',
        pattern: 'hearts'
      },
      boys: {
        id: 'boys',
        title: 'أبطال المغامرة',
        subtitle: 'انطلاقة نحو القمة 🚀⚡',
        bgTop: '#090D16',
        bgBottom: '#172554',
        borderColor: '#22D3EE',
        accentColor: '#FACC15',
        textColor: '#E0F2FE',
        stickerLeft: '🚀',
        stickerRight: '⚡',
        pattern: 'stars'
      },
      adults: {
        id: 'adults',
        title: 'لحظة VIP مميزة',
        subtitle: 'ذكريات خالدة بأناقة ✨',
        bgTop: '#0A0A0A',
        bgBottom: '#1C1917',
        borderColor: '#D4AF37',
        accentColor: '#FDE68A',
        textColor: '#FDE68A',
        stickerLeft: '✨',
        stickerRight: '🥂',
        pattern: 'gold'
      }
    };

    /**
     * Web Audio API subtle countdown & shutter sound generator (zero external assets)
     */
    const SoundEngine = {
      ctx: null,
      unlock() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        } catch (err) {
          // Ignore audio errors on restricted devices
        }
      },
      playBeep(freq = 700, duration = 0.12) {
        try {
          this.unlock();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (err) {
          // Safe fallback
        }
      },
      playShutter() {
        try {
          this.unlock();
          if (!this.ctx) return;
          const bufferSize = Math.floor(this.ctx.sampleRate * 0.08);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
          noise.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start();
        } catch (err) {
          // Safe fallback
        }
      }
    };

    /**
     * Lock viewport gestures (pinch zoom, multi-touch pan, double-tap zoom)
     */
    function installViewportLocks() {
      document.addEventListener('gesturestart', (e) => {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('gesturechange', (e) => {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('gestureend', (e) => {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    }

    /**
     * Simulated live camera feed renderer when real camera is unavailable or denied
     */
    function startSimulatedCameraLoop() {
      if (STATE.simAnimFrame) {
        cancelAnimationFrame(STATE.simAnimFrame);
      }
      const bgCanvas = document.getElementById('bgSimCanvas');
      const liveCanvas = document.getElementById('liveSimCanvas');
      const canvases = [bgCanvas, liveCanvas].filter(Boolean);

      const renderFrame = (timeMs) => {
        const t = timeMs * 0.001;
        canvases.forEach((canvas) => {
          const ctx = canvas.getContext('2d');
          if (!ctx) return;
          const w = canvas.width;
          const h = canvas.height;

          const grad = ctx.createLinearGradient(0, 0, w, h);
          grad.addColorStop(0, '#1e1b4b');
          grad.addColorStop(0.5, '#311042');
          grad.addColorStop(1, '#0f172a');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);

          // Moving soft orbs to simulate live studio feed
          const orbs = [
            { x: w * (0.3 + 0.12 * Math.sin(t * 0.9)), y: h * (0.4 + 0.1 * Math.cos(t * 0.7)), r: w * 0.22, color: 'rgba(99, 102, 241, 0.35)' },
            { x: w * (0.72 + 0.1 * Math.cos(t * 0.8)), y: h * (0.55 + 0.12 * Math.sin(t * 0.6)), r: w * 0.24, color: 'rgba(236, 72, 153, 0.30)' },
            { x: w * 0.5, y: h * 0.5, r: w * 0.15, color: 'rgba(56, 189, 248, 0.18)' }
          ];

          orbs.forEach((orb) => {
            const rg = ctx.createRadialGradient(orb.x, orb.y, 10, orb.x, orb.y, orb.r);
            rg.addColorStop(0, orb.color);
            rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
            ctx.fill();
          });

          // Subtle studio framing guide
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
          ctx.lineWidth = 4;
          ctx.strokeRect(w * 0.12, h * 0.1, w * 0.76, h * 0.8);
        });

        STATE.simAnimFrame = requestAnimationFrame(renderFrame);
      };

      STATE.simAnimFrame = requestAnimationFrame(renderFrame);
    }

    /**
     * Ensure camera stream is initialized with graceful fallback constraints
     */
    async function ensureCameraAccess() {
      const bgVideo = document.getElementById('bgVideo');
      const liveVideo = document.getElementById('liveVideo');
      const bgSim = document.getElementById('bgSimCanvas');
      const liveSim = document.getElementById('liveSimCanvas');
      const startBadge = document.getElementById('startCameraBadge');
      const modeBadge = document.getElementById('captureModeBadge');

      // Reuse active live stream if still open
      if (STATE.stream && STATE.hasLiveVideoStream) {
        const activeTracks = STATE.stream.getVideoTracks().filter((tr) => tr.readyState === 'live');
        if (activeTracks.length > 0 && liveVideo.videoWidth > 0) {
          bgVideo.classList.remove('hidden');
          liveVideo.classList.remove('hidden');
          bgSim.classList.add('hidden');
          liveSim.classList.add('hidden');
          modeBadge.classList.add('hidden');
          return true;
        }
      }

      stopMediaStream();

      if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
        STATE.hasLiveVideoStream = false;
        STATE.simulatedMode = true;
        startSimulatedCameraLoop();
        bgVideo.classList.add('hidden');
        liveVideo.classList.add('hidden');
        bgSim.classList.remove('hidden');
        liveSim.classList.remove('hidden');
        startBadge.textContent = 'وضع الكاميرا الافتراضية جاهز';
        modeBadge.classList.remove('hidden');
        return false;
      }

      const constraintCandidates = [
        { video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
        { video: { facingMode: 'user' }, audio: false },
        { video: true, audio: false }
      ];

      for (const constraints of constraintCandidates) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          STATE.stream = stream;
          bgVideo.srcObject = stream;
          liveVideo.srcObject = stream;

          await Promise.all([
            bgVideo.play().catch(() => {}),
            liveVideo.play().catch(() => {})
          ]);

          // Wait briefly for videoWidth to populate
          await waitForVideoDimensions(liveVideo, 1200);

          if (liveVideo.videoWidth > 0 || bgVideo.videoWidth > 0) {
            STATE.hasLiveVideoStream = true;
            STATE.simulatedMode = false;
            bgVideo.classList.remove('hidden');
            liveVideo.classList.remove('hidden');
            bgSim.classList.add('hidden');
            liveSim.classList.add('hidden');
            startBadge.textContent = 'الكاميرا الحية متصلة';
            modeBadge.classList.add('hidden');
            return true;
          }
        } catch (err) {
          // Try next fallback constraint
        }
      }

      // Camera blocked, missing, or restricted -> Seamless simulated live canvas fallback
      stopMediaStream();
      STATE.hasLiveVideoStream = false;
      STATE.simulatedMode = true;
      startSimulatedCameraLoop();
      bgVideo.classList.add('hidden');
      liveVideo.classList.add('hidden');
      bgSim.classList.remove('hidden');
      liveSim.classList.remove('hidden');
      startBadge.textContent = 'وضع المعاينة الافتراضية نشط';
      modeBadge.classList.remove('hidden');
      return false;
    }

    function waitForVideoDimensions(videoEl, timeoutMs = 1200) {
      return new Promise((resolve) => {
        if (videoEl.videoWidth > 0) {
          resolve(true);
          return;
        }
        const start = Date.now();
        const check = () => {
          if (videoEl.videoWidth > 0) {
            resolve(true);
          } else if (Date.now() - start >= timeoutMs) {
            resolve(false);
          } else {
            requestAnimationFrame(check);
          }
        };
        check();
      });
    }

    function stopMediaStream() {
      if (STATE.stream) {
        try {
          STATE.stream.getTracks().forEach((track) => track.stop());
        } catch (err) {
          // Ignore stop errors
        }
        STATE.stream = null;
      }
    }

    /**
     * Switch between Screen 1 ('start'), Screen 2 ('capture'), and Screen 3 ('print')
     */
    function setActiveScreen(screenName) {
      STATE.screen = screenName;
      document.getElementById('screenStart').classList.toggle('hidden', screenName !== 'start');
      document.getElementById('screenCapture').classList.toggle('hidden', screenName !== 'capture');
      document.getElementById('screenPrint').classList.toggle('hidden', screenName !== 'print');
    }

    /**
     * Screen 1 Button Handler: Unlock audio, switch to capture screen, and run 6s -> 3s capture flow
     */
    async function handleStartBoothClick() {
      if (STATE.isCaptureRunning) return;
      STATE.isCaptureRunning = true;
      const currentSession = ++STATE.sessionId;
      STATE.capturedPhotos = [];
      renderCapturedThumbnails();

      SoundEngine.unlock();
      setActiveScreen('capture');

      // Guarantee camera or simulated feed is ready without ever hanging
      await ensureCameraAccess();
      if (currentSession !== STATE.sessionId) {
        STATE.isCaptureRunning = false;
        return;
      }

      try {
        for (let shotIdx = 0; shotIdx < STATE.shotCount; shotIdx++) {
          if (currentSession !== STATE.sessionId) break;

          document.getElementById('shotProgressBadge').textContent = `الصورة ${shotIdx + 1} من ${STATE.shotCount}`;

          // 6 seconds before first shot; 3 seconds between subsequent shots
          const countdownSeconds = shotIdx === 0 ? STATE.initialCountdownSec : STATE.betweenShotsSec;
          const labelText = shotIdx === 0 ? 'استعد! يبدأ التصوير خلال...' : `استعد للصورة ${shotIdx + 1}...`;

          await runCountdown(countdownSeconds, labelText, currentSession);
          if (currentSession !== STATE.sessionId) break;

          const frameDataUrl = captureCurrentFrame();
          STATE.capturedPhotos.push(frameDataUrl);
          renderCapturedThumbnails();

          if (shotIdx < STATE.shotCount - 1) {
            await delayMs(450, currentSession);
          }
        }

        if (currentSession === STATE.sessionId) {
          STATE.isCaptureRunning = false;
          await renderSelphyComposition();
          setActiveScreen('print');
        }
      } catch (err) {
        STATE.isCaptureRunning = false;
        // Even on unexpected error, allow proceeding or resetting cleanly
        if (currentSession === STATE.sessionId && STATE.capturedPhotos.length > 0) {
          await renderSelphyComposition();
          setActiveScreen('print');
        } else if (currentSession === STATE.sessionId) {
          resetToStartScreen();
        }
      }
    }

    /**
     * Run countdown from `seconds` down to `1`
     */
    function runCountdown(seconds, labelText, sessionToken) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('countdownOverlay');
        const labelEl = document.getElementById('countdownLabel');
        const numEl = document.getElementById('countdownNumber');

        overlay.classList.remove('hidden');
        labelEl.textContent = labelText;

        let remaining = seconds;

        const tick = () => {
          if (sessionToken !== STATE.sessionId) {
            overlay.classList.add('hidden');
            resolve();
            return;
          }

          if (remaining > 0) {
            numEl.textContent = String(remaining);
            labelEl.textContent = remaining === 1 ? 'ابتسم للكاميرا! 📸' : labelText;

            numEl.classList.remove('count-pop');
            void numEl.offsetWidth;
            numEl.classList.add('count-pop');

            SoundEngine.playBeep(remaining === 1 ? 960 : 660, 0.12);
            remaining -= 1;
            setTimeout(tick, 1000);
          } else {
            overlay.classList.add('hidden');
            resolve();
          }
        };

        tick();
      });
    }

    /**
     * Capture current frame from live <video> or fallback simulated <canvas>
     */
    function captureCurrentFrame() {
      triggerCameraFlash();
      SoundEngine.playShutter();

      const liveVideo = document.getElementById('liveVideo');
      const liveSim = document.getElementById('liveSimCanvas');
      const offscreen = document.createElement('canvas');
      offscreen.width = 1080;
      offscreen.height = 720;
      const ctx = offscreen.getContext('2d');

      const useRealVideo = STATE.hasLiveVideoStream && liveVideo && liveVideo.videoWidth > 0 && liveVideo.videoHeight > 0;

      ctx.save();
      if (STATE.mirrorCamera) {
        ctx.translate(offscreen.width, 0);
        ctx.scale(-1, 1);
      }

      if (useRealVideo) {
        drawCoverFit(ctx, liveVideo, liveVideo.videoWidth, liveVideo.videoHeight, 0, 0, offscreen.width, offscreen.height);
      } else if (liveSim) {
        drawCoverFit(ctx, liveSim, liveSim.width, liveSim.height, 0, 0, offscreen.width, offscreen.height);
      } else {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, offscreen.width, offscreen.height);
      }

      ctx.restore();
      return offscreen.toDataURL('image/jpeg', 0.92);
    }

    function triggerCameraFlash() {
      const flashEl = document.getElementById('flashOverlay');
      flashEl.classList.remove('flash-burst');
      void flashEl.offsetWidth;
      flashEl.classList.add('flash-burst');
    }

    function renderCapturedThumbnails() {
      const container = document.getElementById('capturedThumbnails');
      container.innerHTML = STATE.capturedPhotos.map((src, idx) => `
        <div class="w-11 h-8 sm:w-14 sm:h-10 rounded-lg overflow-hidden border-2 border-emerald-400 shadow">
          <img src="${src}" alt="لقطة ${idx + 1}" class="w-full h-full object-cover" />
        </div>
      `).join('');
    }

    /**
     * Screen 3: Select one of the 4 fixed themes and immediately update 1200x1800 print canvas
     */
    async function selectFixedTheme(themeKey) {
      if (!FIXED_THEMES[themeKey]) return;
      STATE.selectedTheme = themeKey;

      const buttons = document.querySelectorAll('.theme-card-btn');
      buttons.forEach((btn) => {
        const isSelected = btn.getAttribute('data-theme') === themeKey;
        if (isSelected) {
          btn.className = 'theme-card-btn p-3.5 sm:p-4 rounded-2xl border-2 text-right transition flex items-center gap-3 bg-gradient-to-br from-indigo-600/45 to-pink-600/35 border-amber-300 text-white shadow-lg scale-[1.01]';
        } else {
          btn.className = 'theme-card-btn p-3.5 sm:p-4 rounded-2xl border-2 text-right transition flex items-center gap-3 bg-slate-900/75 border-white/15 hover:border-white/35 text-slate-200';
        }
      });

      await renderSelphyComposition();
    }

    /**
     * Compose 1200x1800 px (300 DPI at 4x6 inch / 100x148 mm) portrait print sheet
     */
    async function renderSelphyComposition() {
      const canvas = document.getElementById('selphyCanvas');
      const ctx = canvas.getContext('2d');
      const W = 1200;
      const H = 1800;
      canvas.width = W;
      canvas.height = H;

      const theme = FIXED_THEMES[STATE.selectedTheme] || FIXED_THEMES.kids;

      // Background gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
      bgGrad.addColorStop(0, theme.bgTop);
      bgGrad.addColorStop(1, theme.bgBottom);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // Decorative theme accents
      drawThemeDecorations(ctx, W, H, theme);

      // Outer frame border
      ctx.strokeStyle = theme.borderColor;
      ctx.lineWidth = 18;
      roundRectPath(ctx, 28, 28, W - 56, H - 56, 36);
      ctx.stroke();

      // Header banner
      ctx.fillStyle = theme.textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '900 54px "Cairo", sans-serif';
      ctx.fillText(theme.title, W / 2, 108);

      // Photo slots (3 vertical photos arranged cleanly inside 1200x1800 4x6 layout)
      const count = Math.max(1, STATE.capturedPhotos.length || STATE.shotCount);
      const topArea = 165;
      const bottomArea = 1585;
      const availableH = bottomArea - topArea;
      const gap = 24;
      const slotW = W - 150;
      const slotH = Math.floor((availableH - gap * (count - 1)) / count);
      const slotX = (W - slotW) / 2;

      const loadedImgs = await Promise.all(
        (STATE.capturedPhotos.length ? STATE.capturedPhotos : [createPlaceholderPhoto(theme)]).map(loadImageElement)
      );

      for (let i = 0; i < count; i++) {
        const y = topArea + i * (slotH + gap);
        const img = loadedImgs[i % loadedImgs.length];

        ctx.save();
        roundRectPath(ctx, slotX, y, slotW, slotH, 24);
        ctx.clip();
        if (img) {
          drawCoverFit(ctx, img, img.naturalWidth || img.width, img.naturalHeight || img.height, slotX, y, slotW, slotH);
        } else {
          ctx.fillStyle = '#334155';
          ctx.fillRect(slotX, y, slotW, slotH);
        }
        ctx.restore();

        // Crisp photo frame outline
        ctx.strokeStyle = theme.borderColor;
        ctx.lineWidth = 6;
        roundRectPath(ctx, slotX, y, slotW, slotH, 24);
        ctx.stroke();
      }

      // Footer caption & stickers
      ctx.fillStyle = theme.textColor;
      ctx.font = '800 42px "Cairo", sans-serif';
      ctx.fillText(theme.subtitle, W / 2, 1665);

      ctx.font = '700 56px sans-serif';
      ctx.fillText(theme.stickerLeft, 130, 1665);
      ctx.fillText(theme.stickerRight, W - 130, 1665);

      const finalDataUrl = canvas.toDataURL('image/jpeg', 0.95);
      document.getElementById('composedPreviewImg').src = finalDataUrl;
      document.getElementById('printOnlyImg').src = finalDataUrl;
    }

    function drawThemeDecorations(ctx, W, H, theme) {
      ctx.save();
      ctx.globalAlpha = 0.16;
      for (let i = 0; i < 24; i++) {
        const px = ((i * 197) % (W - 120)) + 60;
        const py = ((i * 313) % (H - 120)) + 60;
        const r = 10 + (i % 4) * 7;
        ctx.fillStyle = i % 2 === 0 ? theme.borderColor : theme.accentColor;
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function createPlaceholderPhoto(theme) {
      const c = document.createElement('canvas');
      c.width = 900;
      c.height = 600;
      const ctx = c.getContext('2d');
      ctx.fillStyle = theme.borderColor;
      ctx.fillRect(0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', 0.8);
    }

    function loadImageElement(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function drawCoverFit(ctx, source, srcW, srcH, dx, dy, dw, dh) {
      if (!srcW || !srcH) return;
      const srcRatio = srcW / srcH;
      const dstRatio = dw / dh;
      let sx = 0;
      let sy = 0;
      let sw = srcW;
      let sh = srcH;

      if (srcRatio > dstRatio) {
        sw = srcH * dstRatio;
        sx = (srcW - sw) / 2;
      } else {
        sh = srcW / dstRatio;
        sy = (srcH - sh) / 2;
      }

      ctx.drawImage(source, sx, sy, sw, sh, dx, dy, dw, dh);
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function delayMs(ms, sessionToken) {
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve(sessionToken === STATE.sessionId);
        }, ms);
      });
    }

    /**
     * Direct print action for Canon SELPHY Wi-Fi / AirPrint (100mm x 148mm / 4x6 inch)
     */
    async function triggerDirectPrint() {
      await renderSelphyComposition();
      showStatusToast('جاري إرسال الصورة للطباعة • الاستلام من الكاشير');
      setTimeout(() => {
        try {
          window.print();
        } catch (err) {
          showStatusToast('يرجى استخدام خيار الطباعة من المتصفح • الاستلام من الكاشير');
        }
      }, 180);
    }

    /**
     * Reset cleanly back to Screen 1 (Start Kiosk)
     */
    async function resetToStartScreen() {
      STATE.sessionId += 1;
      STATE.isCaptureRunning = false;
      STATE.capturedPhotos = [];
      document.getElementById('countdownOverlay').classList.add('hidden');
      renderCapturedThumbnails();
      setActiveScreen('start');
      await ensureCameraAccess();
    }

    let toastTimeout = null;
    function showStatusToast(message) {
      const toast = document.getElementById('statusToast');
      const textEl = document.getElementById('statusToastText');
      textEl.textContent = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 3200);
    }

    /**
     * Initialize Kiosk on Load
     */
    window.addEventListener('DOMContentLoaded', async () => {
      installViewportLocks();
      startSimulatedCameraLoop();
      await selectFixedTheme('kids');
      await ensureCameraAccess();
    });
  </script>
</body>
</html>
