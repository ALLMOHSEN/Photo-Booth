<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>فوتو بوث الذكريات | Canon SELPHY</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Arabic Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* Strict Kiosk Lock: prevent zoom, pan, bounce, selection, and callouts */
    html, body {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: 'Cairo', sans-serif;
      background-color: #050814;
      color: #f8fafc;
    }

    button, [role="button"] {
      touch-action: manipulation;
      cursor: pointer;
    }

    /* Ambient blurred live background on Screen 1 */
    .ambient-video-blur {
      filter: blur(14px) brightness(0.72);
      transform: scale(1.08);
    }

    .ambient-video-blur.mirrored {
      transform: scaleX(-1) scale(1.08);
    }

    /* Clear live camera feed on Screen 2 */
    .live-camera-feed {
      filter: blur(0px) brightness(1);
      transform: scale(1);
    }

    .live-camera-feed.mirrored {
      transform: scaleX(-1);
    }

    /* Subtle pulse for primary Kiosk start button */
    @keyframes kioskPulse {
      0%, 100% {
        box-shadow: 0 0 35px rgba(99, 102, 241, 0.55), 0 0 75px rgba(236, 72, 153, 0.28);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 50px rgba(99, 102, 241, 0.8), 0 0 100px rgba(236, 72, 153, 0.45);
        transform: scale(1.02);
      }
    }

    .start-btn-glow {
      animation: kioskPulse 2.8s infinite ease-in-out;
    }

    /* Camera flash overlay animation */
    @keyframes flashBurst {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    .flash-burst {
      animation: flashBurst 0.45s ease-out forwards;
    }

    /* Countdown number entrance */
    @keyframes countPop {
      0% { transform: scale(0.45); opacity: 0; }
      35% { transform: scale(1.12); opacity: 1; }
      85% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.85); opacity: 0; }
    }

    .count-pop {
      animation: countPop 0.9s ease-in-out forwards;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* Print-only container hidden on screen */
    #printOnlyContainer {
      display: none;
    }

    /* Compact one-tap theme pills that stay crisp and uncluttered */
    .theme-pill-btn {
      touch-action: manipulation;
    }

    .layout-pill-btn {
      touch-action: manipulation;
    }

    /* Exact 100mm x 148mm / 4in x 6in borderless print stylesheet for Canon SELPHY */
    @page {
      size: 100mm 148mm;
      margin: 0;
    }

    @media print {
      @page {
        size: 100mm 148mm;
        margin: 0 !important;
      }

      html, body {
        width: 100mm !important;
        height: 148mm !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        background: #ffffff !important;
      }

      body > *:not(#printOnlyContainer) {
        display: none !important;
      }

      #printOnlyContainer {
        display: block !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100mm !important;
        height: 148mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        z-index: 999999 !important;
      }

      #printOnlyImg {
        width: 100mm !important;
        height: 148mm !important;
        max-width: none !important;
        max-height: none !important;
        object-fit: fill !important;
        display: block !important;
      }
    }
  </style>
</head>
<body class="relative select-none overflow-hidden">

  <!-- Full-screen flash overlay on photo capture -->
  <div id="flashOverlay" class="fixed inset-0 bg-white pointer-events-none opacity-0 z-50"></div>

  <!-- Print-only full-bleed 100mm x 148mm output -->
  <div id="printOnlyContainer" aria-hidden="true">
    <img id="printOnlyImg" alt="Canon SELPHY 4x6 Print" />
  </div>

  <!-- Toast notification banner -->
  <div id="statusToast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300 px-3 max-w-full">
    <div id="statusToastText" class="px-5 py-2.5 rounded-2xl bg-slate-900/95 border border-emerald-400/40 text-white text-xs sm:text-sm font-extrabold shadow-2xl text-center"></div>
  </div>

  <!-- ===================================================================== -->
  <!-- SCREEN 1: START KIOSK (Blurred Live Camera BG + Single Center CTA)   -->
  <!-- ===================================================================== -->
  <section id="screenStart" class="relative w-full h-full flex items-center justify-center p-4 sm:p-6 overflow-hidden">
    <!-- Live Camera Background + Simulated Fallback Canvas -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
      <video id="bgVideo" autoplay playsinline muted class="w-full h-full object-cover ambient-video-blur mirrored hidden"></video>
      <canvas id="bgSimCanvas" width="1280" height="720" class="w-full h-full object-cover ambient-video-blur"></canvas>
      <!-- Dark vignette overlay -->
      <div class="fixed inset-0 bg-gradient-to-b from-slate-950/55 via-slate-950/35 to-slate-950/65"></div>
    </div>

    <!-- Subtle camera mode badge -->
    <div id="startCameraBadge" class="fixed top-4 right-4 z-20 px-3.5 py-1.5 rounded-full bg-black/55 border border-white/15 text-[11px] sm:text-xs font-bold text-slate-200 pointer-events-none">
      جاري فحص الكاميرا...
    </div>

    <!-- Subtle top-left admin shot count toggle (3 or 4 shots) -->
    <button
      id="btnAdminShotCount"
      type="button"
      onclick="toggleAdminShotCount()"
      title="تغيير عدد الصور (3 أو 4)"
      class="fixed top-4 left-4 z-20 px-3 py-1.5 rounded-full bg-black/45 hover:bg-black/70 border border-white/15 text-[11px] sm:text-xs font-bold text-slate-300 transition"
    >
      <span id="adminShotCountLabel">3 لقطات</span>
    </button>

    <!-- Single Centered CTA Button -->
    <div class="relative z-10 w-full max-w-xl flex items-center justify-center">
      <button
        id="btnStartBooth"
        type="button"
        onclick="handleStartBoothClick()"
        class="start-btn-glow w-full sm:w-auto sm:min-w-[400px] px-8 py-9 sm:px-12 sm:py-11 rounded-[2.25rem] bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:via-purple-500 hover:to-pink-500 active:scale-95 text-white border-2 border-white/25 transition-all duration-200 flex flex-col items-center justify-center gap-3"
      >
        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-white/15 flex items-center justify-center shadow-inner">
          <svg class="w-9 h-9 sm:w-11 sm:h-11 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <circle cx="12" cy="13" r="3.5" />
          </svg>
        </div>
        <span class="text-2xl sm:text-4xl font-black tracking-tight text-center leading-snug">
          أخذ صورة ذكرى بسعر 5,000
        </span>
      </button>
    </div>
  </section>

  <!-- ===================================================================== -->
  <!-- SCREEN 3: SIMPLE DIVERSE THEMES + DUAL STRIP / POSTCARD + DIRECT PRINT -->
  <!-- ===================================================================== -->
  <section id="screenPrint" class="hidden relative w-full h-full p-3 sm:p-5 lg:p-6 flex flex-col lg:flex-row gap-4 lg:gap-6 items-stretch justify-center overflow-hidden">
    <!-- Left / Right Preview Column: 4x6 Canon SELPHY Composition -->
    <div class="lg:w-1/2 h-[42%] lg:h-full glass-panel rounded-3xl p-3 sm:p-5 flex flex-col items-center justify-center relative overflow-hidden">
      <img
        id="composedPreviewImg"
        alt="معاينة الصورة النهائية 4x6"
        class="max-h-full w-auto rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.85)] border-2 border-white/20 object-contain"
      />
      <span id="previewFormatBadge" class="absolute top-3 left-3 px-3 py-1 rounded-full bg-black/70 border border-emerald-400/35 text-[11px] font-extrabold text-emerald-300">
        بوست كارد (4×6) • Canon SELPHY
      </span>
    </div>

    <!-- Controls Column: Simple Diverse Themes + Print Layout + Direct Print -->
    <div class="lg:w-1/2 h-[58%] lg:h-full glass-panel rounded-3xl p-3.5 sm:p-5 lg:p-6 flex flex-col justify-between gap-2.5 overflow-hidden">
      <div class="flex flex-col gap-2.5 overflow-y-auto pr-0.5">
        <div class="flex items-center justify-between gap-2">
          <h2 class="text-base sm:text-xl font-black text-white">اختر الثيم</h2>

          <!-- Simple Layout Switcher: بوست كارد (4×6) / شريطين (2×6) -->
          <div class="inline-flex rounded-xl bg-slate-900/90 p-1 border border-white/15 shrink-0" role="group" aria-label="قياس الطباعة">
            <button
              type="button"
              data-layout="postcard"
              onclick="selectPrintLayout('postcard')"
              class="layout-pill-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-black transition bg-indigo-600 text-white shadow"
            >
              بوست كارد (4×6)
            </button>
            <button
              type="button"
              data-layout="dual_strip"
              onclick="selectPrintLayout('dual_strip')"
              class="layout-pill-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-black transition text-slate-300 hover:text-white"
            >
              شريطين (2×6)
            </button>
          </div>
        </div>

        <!-- Simple One-Tap Diverse Themes Grid -->
        <div id="diverseThemesGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2">
          <button
            type="button"
            data-theme="kids"
            onclick="selectTheme('kids')"
            class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-amber-500/25 border-amber-300 text-white shadow"
          >
            <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-amber-300 to-sky-400"></span>
            <span class="text-xs sm:text-sm font-black leading-tight">أطفال — مرح ونجوم</span>
          </button>

          <button
            type="button"
            data-theme="girls"
            onclick="selectTheme('girls')"
            class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-pink-400/60 text-slate-200"
          >
            <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-pink-400 to-rose-500"></span>
            <span class="text-xs sm:text-sm font-black leading-tight">بنات — وردي وأنيق</span>
          </button>

          <button
            type="button"
            data-theme="boys"
            onclick="selectTheme('boys')"
            class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-cyan-400/60 text-slate-200"
          >
            <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-cyan-400 to-blue-600"></span>
            <span class="text-xs sm:text-sm font-black leading-tight">أولاد — أزرق ونيون</span>
          </button>

          <button
            type="button"
            data-theme="adults"
            onclick="selectTheme('adults')"
            class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-yellow-400/60 text-slate-200"
          >
            <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-neutral-900 to-amber-500"></span>
            <span class="text-xs sm:text-sm font-black leading-tight">كبار — أسود وذهبي VIP</span>
          </button>

          <button
            type="button"
            data-theme="royal_white"
            onclick="selectTheme('royal_white')"
            class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-amber-200/70 text-slate-200"
          >
            <span class="w-5 h-5 rounded-full shrink-0 border border-slate-400 bg-gradient-to-br from-white to-amber-200"></span>
            <span class="text-xs sm:text-sm font-black leading-tight">أبيض ملكي — كلاسيك</span>
          </button>

          <button
            type="button"
            data-theme="pastel_spring"
            onclick="selectTheme('pastel_spring')"
            class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-teal-300/60 text-slate-200"
          >
            <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-emerald-200 via-purple-200 to-rose-200"></span>
            <span class="text-xs sm:text-sm font-black leading-tight">ألوان الباستيل — ربيعي</span>
          </button>
        </div>
      </div>

      <!-- Primary Print & Reset Actions -->
      <div class="flex flex-col gap-2 pt-2 border-t border-white/10 shrink-0">
          <span>طباعة فورية — الاستلام من الكاشير</span>
        </button>

        <button
          id="btnFinishReset"
          type="button"
          onclick="resetToStartScreen()"
          class="w-full py-3.5 px-5 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-[0.98] border border-white/15 text-slate-100 font-extrabold text-sm sm:text-base transition flex items-center justify-center gap-2"
        >
          <span>إنهاء والعودة</span>
        </button>
      </div>
    </div>
  </section>

  <!-- High-resolution 1200x1800 px (300 DPI at 4x6 inch / 100x148 mm) offscreen print canvas -->
  <canvas id="selphyCanvas" width="1200" height="1800" class="hidden"></canvas>

  <script>
    /**
     * Kiosk State & Configuration
     */
    const STATE = {
      screen: 'start',          // 'start' | 'capture' | 'print'
      shotCount: 3,             // Default 3 photos (toggleable between 3 and 4)
      initialCountdownSec: 6,   // 6s before first photo
      betweenShotsSec: 3,       // 3s between subsequent photos
      selectedTheme: 'kids',    // 'kids' | 'girls' | 'boys' | 'adults' | 'royal_white' | 'pastel_spring'
      printLayout: 'postcard',  // 'postcard' (4x6) | 'dual_strip' (شريطين 2x6 x2 on 4x6 sheet)
      mirrorCamera: true,
      stream: null,
      hasLiveVideoStream: false,
      simulatedMode: false,
      capturedPhotos: [],       // Data URLs for each captured frame
      isCaptureRunning: false,
      sessionId: 0,             // Incrementing token to cancel stale async loops on reset
      simAnimFrame: null
    };

    /**
     * Diverse Themes definitions for 1200x1800 Canon SELPHY Canvas
     */
    const DIVERSE_THEMES = {
      kids: {
        id: 'kids',
        title: 'أطفال — مرح ونجوم',
        subtitle: 'ذكرى مليئة بالمرح والنجوم ⭐🎈',
        bgTop: '#FFFBEB',
        bgBottom: '#E0F2FE',
        borderColor: '#F59E0B',
        accentColor: '#0EA5E9',
        textColor: '#0F172A',
        stickerLeft: '⭐',
        stickerRight: '🎈',
        pattern: 'stars'
      },
      girls: {
        id: 'girls',
        title: 'بنات — وردي وأنيق',
        subtitle: 'لحظات وردية أنيقة ومشرقة 💖✨',
        bgTop: '#FFF1F2',
        bgBottom: '#FCE7F3',
        borderColor: '#EC4899',
        accentColor: '#F43F5E',
        textColor: '#831843',
        stickerLeft: '💖',
        stickerRight: '✨',
        pattern: 'hearts'
      },
      boys: {
        id: 'boys',
        title: 'أولاد — أزرق ونيون',
        subtitle: 'طاقة ونيون وحماس بلا حدود ⚡🔵',
        bgTop: '#061224',
        bgBottom: '#0F172A',
        borderColor: '#06B6D4',
        accentColor: '#3B82F6',
        textColor: '#E0F2FE',
        stickerLeft: '⚡',
        stickerRight: '🎮',
        pattern: 'neon'
      },
      adults: {
        id: 'adults',
        title: 'كبار — أسود وذهبي VIP',
        subtitle: 'أناقة خالدة وحضور VIP ✨🥂',
        bgTop: '#09090B',
        bgBottom: '#18181B',
        borderColor: '#EAB308',
        accentColor: '#FACC15',
        textColor: '#FEF08A',
        stickerLeft: '✨',
        stickerRight: '🥂',
        pattern: 'gold'
      },
      royal_white: {
        id: 'royal_white',
        title: 'أبيض ملكي — كلاسيك',
        subtitle: 'إطلالة كلاسيكية نقية بلمسة ذهبية 🤍',
        bgTop: '#FFFFFF',
        bgBottom: '#FAF8F5',
        borderColor: '#C5A059',
        accentColor: '#A16207',
        textColor: '#1E293B',
        stickerLeft: '🤍',
        stickerRight: '❖',
        pattern: 'classic'
      },
      pastel_spring: {
        id: 'pastel_spring',
        title: 'ألوان الباستيل — ربيعي',
        subtitle: 'نسائم ربيعية ناعمة بألوان الباستيل 🌸🌿',
        bgTop: '#ECFDF5',
        bgBottom: '#F3E8FF',
        borderColor: '#A78BFA',
        accentColor: '#34D399',
        textColor: '#312E81',
        stickerLeft: '🌸',
        stickerRight: '🌿',
        pattern: 'pastel'
      }
    };

    /**
     * Toggle shot count between 3 and 4 from subtle top-left kiosk badge
     */
    function toggleAdminShotCount() {
      if (STATE.isCaptureRunning) return;
      STATE.shotCount = STATE.shotCount === 3 ? 4 : 3;
      document.getElementById('adminShotCountLabel').textContent = `${STATE.shotCount} لقطات`;
      showStatusToast(`تم ضبط عدد اللقطات على ${STATE.shotCount} صور`);
    }

    /**
     * Lock viewport gestures (pinch zoom, multi-touch pan, double-tap zoom, context menu)
     */
    function installViewportLocks() {
      document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });

      document.addEventListener('gesturestart', (e) => {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('gesturechange', (e) => {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('gestureend', (e) => {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    }

    /**
     * Simulated live camera feed renderer when real camera is unavailable or denied
     */
    function startSimulatedCameraLoop() {
      if (STATE.simAnimFrame) {
        cancelAnimationFrame(STATE.simAnimFrame);
      }
      const bgCanvas = document.getElementById('bgSimCanvas');
      const liveCanvas = document.getElementById('liveSimCanvas');
      const canvases = [bgCanvas, liveCanvas].filter(Boolean);

      const renderFrame = (timeMs) => {
        const t = timeMs * 0.001;
        canvases.forEach((canvas) => {
          const ctx = canvas.getContext('2d');
          if (!ctx) return;
          const w = canvas.width;
          const h = canvas.height;

          const grad = ctx.createLinearGradient(0, 0, w, h);
          grad.addColorStop(0, '#1e1b4b');
          grad.addColorStop(0.5, '#311042');
          grad.addColorStop(1, '#0f172a');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);

          // Moving soft orbs to simulate live studio feed
          const orbs = [
            { x: w * (0.3 + 0.12 * Math.sin(t * 0.9)), y: h * (0.4 + 0.1 * Math.cos(t * 0.7)), r: w * 0.22, color: 'rgba(99, 102, 241, 0.35)' },
            { x: w * (0.72 + 0.1 * Math.cos(t * 0.8)), y: h * (0.55 + 0.12 * Math.sin(t * 0.6)), r: w * 0.24, color: 'rgba(236, 72, 153, 0.30)' },
            { x: w * 0.5, y: h * 0.5, r: w * 0.15, color: 'rgba(56, 189, 248, 0.18)' }
          ];

          orbs.forEach((orb) => {
            const rg = ctx.createRadialGradient(orb.x, orb.y, 10, orb.x, orb.y, orb.r);
            rg.addColorStop(0, orb.color);
            rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
            ctx.fill();
          });

          // Subtle studio framing guide
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
          ctx.lineWidth = 4;
          ctx.strokeRect(w * 0.12, h * 0.1, w * 0.76, h * 0.8);
        });

        STATE.simAnimFrame = requestAnimationFrame(renderFrame);
      };

      STATE.simAnimFrame = requestAnimationFrame(renderFrame);
    }

    /**
     * Screen 3: Select one of the diverse themes and immediately update 1200x1800 print canvas
     */
    async function selectTheme(themeKey) {
      if (!DIVERSE_THEMES[themeKey]) return;
      STATE.selectedTheme = themeKey;

      const buttons = document.querySelectorAll('.theme-pill-btn');
      buttons.forEach((btn) => {
        const isSelected = btn.getAttribute('data-theme') === themeKey;
        if (isSelected) {
          btn.className = 'theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-indigo-600/40 border-amber-300 text-white shadow scale-[1.01]';
        } else {
          btn.className = 'theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-white/35 text-slate-200';
        }
      });

      await renderSelphyComposition();
    }

    /**
     * Screen 3: Switch between Postcard (4x6) and Dual Strip (شريطين 2x6)
     */
    async function selectPrintLayout(layoutKey) {
      if (layoutKey !== 'postcard' && layoutKey !== 'dual_strip') return;
      STATE.printLayout = layoutKey;

      const buttons = document.querySelectorAll('.layout-pill-btn');
      buttons.forEach((btn) => {
        const active = btn.getAttribute('data-layout') === layoutKey;
        btn.className = active
          ? 'layout-pill-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-black transition bg-indigo-600 text-white shadow'
          : 'layout-pill-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-black transition text-slate-300 hover:text-white';
      });

      const badge = document.getElementById('previewFormatBadge');
      badge.textContent = layoutKey === 'dual_strip'
        ? 'شريطين (2×6 ×2) • Canon SELPHY 4×6"'
        : 'بوست كارد (4×6) • Canon SELPHY 100×148mm';

      await renderSelphyComposition();
    }

    /**
     * Draw one photo strip column (used once for Postcard 4x6 or twice side-by-side for Dual Strip 2x6)
     */
    function drawSingleStripColumn(ctx, theme, loadedImgs, count, x, y, w, h, isCompactStrip) {
      // Strip background
      const grad = ctx.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, theme.bgTop);
      grad.addColorStop(1, theme.bgBottom);
      ctx.fillStyle = grad;
      roundRectPath(ctx, x, y, w, h, isCompactStrip ? 20 : 32);
      ctx.fill();

      // Decorative dots inside strip
      ctx.save();
      roundRectPath(ctx, x, y, w, h, isCompactStrip ? 20 : 32);
      ctx.clip();
      ctx.globalAlpha = 0.14;
      const dotCount = isCompactStrip ? 14 : 24;
      for (let i = 0; i < dotCount; i++) {
        const dx = x + (((i * 137) % Math.max(80, w - 60)) + 30);
        const dy = y + (((i * 251) % Math.max(120, h - 80)) + 40);
        const r = (isCompactStrip ? 6 : 10) + (i % 3) * (isCompactStrip ? 4 : 7);
        ctx.fillStyle = i % 2 === 0 ? theme.borderColor : theme.accentColor;
        ctx.beginPath();
        ctx.arc(dx, dy, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Frame border
      ctx.strokeStyle = theme.borderColor;
      ctx.lineWidth = isCompactStrip ? 8 : 16;
      roundRectPath(ctx, x + 8, y + 8, w - 16, h - 16, isCompactStrip ? 18 : 28);
      ctx.stroke();

      // Header title
      const padX = isCompactStrip ? 22 : 64;
      const headerY = y + (isCompactStrip ? 62 : 95);
      const footerY = y + h - (isCompactStrip ? 64 : 105);
      const photosTop = y + (isCompactStrip ? 105 : 155);
      const photosBottom = y + h - (isCompactStrip ? 108 : 165);
      const gap = isCompactStrip ? 16 : 24;
      const slotW = w - padX * 2;
      const slotH = Math.max(80, Math.floor((photosBottom - photosTop - gap * (count - 1)) / count));

      ctx.fillStyle = theme.textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = isCompactStrip ? '900 28px "Cairo", sans-serif' : '900 48px "Cairo", sans-serif';
      ctx.fillText(theme.title, x + w / 2, headerY, w - 36);

      for (let i = 0; i < count; i++) {
        const py = photosTop + i * (slotH + gap);
        const img = loadedImgs[i % loadedImgs.length];

        ctx.save();
        roundRectPath(ctx, x + padX, py, slotW, slotH, isCompactStrip ? 14 : 22);
        ctx.clip();
        if (img) {
          drawCoverFit(ctx, img, img.naturalWidth || img.width, img.naturalHeight || img.height, x + padX, py, slotW, slotH);
        } else {
          ctx.fillStyle = '#334155';
          ctx.fillRect(x + padX, py, slotW, slotH);
        }
        ctx.restore();

        ctx.strokeStyle = theme.borderColor;
        ctx.lineWidth = isCompactStrip ? 4 : 6;
        roundRectPath(ctx, x + padX, py, slotW, slotH, isCompactStrip ? 14 : 22);
        ctx.stroke();
      }

      // Footer text & stickers
      ctx.fillStyle = theme.textColor;
      ctx.font = isCompactStrip ? '800 22px "Cairo", sans-serif' : '800 38px "Cairo", sans-serif';
      ctx.fillText(theme.subtitle, x + w / 2, footerY, w - (isCompactStrip ? 110 : 240));

      ctx.font = isCompactStrip ? '700 28px sans-serif' : '700 52px sans-serif';
      ctx.fillText(theme.stickerLeft, x + (isCompactStrip ? 36 : 110), footerY);
      ctx.fillText(theme.stickerRight, x + w - (isCompactStrip ? 36 : 110), footerY);
    }

    /**
     * Compose 1200x1800 px (300 DPI at 4x6 inch / 100x148 mm) print sheet
     */
    async function renderSelphyComposition() {
      const canvas = document.getElementById('selphyCanvas');
      const ctx = canvas.getContext('2d');
      const W = 1200;
      const H = 1800;
      canvas.width = W;
      canvas.height = H;

      const theme = DIVERSE_THEMES[STATE.selectedTheme] || DIVERSE_THEMES.kids;
      const count = Math.max(1, STATE.capturedPhotos.length || STATE.shotCount);
      const loadedImgs = await Promise.all(
        (STATE.capturedPhotos.length ? STATE.capturedPhotos : [createPlaceholderPhoto(theme)]).map(loadImageElement)
      );

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, W, H);

      if (STATE.printLayout === 'dual_strip') {
        // Two 2x6 strips side-by-side on one 4x6 (1200x1800) Canon SELPHY sheet
        const marginX = 24;
        const centerGap = 24;
        const stripW = Math.floor((W - marginX * 2 - centerGap) / 2);
        const stripY = 20;
        const stripH = H - 40;

        drawSingleStripColumn(ctx, theme, loadedImgs, count, marginX, stripY, stripW, stripH, true);
        drawSingleStripColumn(ctx, theme, loadedImgs, count, marginX + stripW + centerGap, stripY, stripW, stripH, true);

        // Subtle center cut guide line
        ctx.save();
        ctx.setLineDash([12, 12]);
        ctx.strokeStyle = 'rgba(100, 116, 139, 0.55)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(W / 2, 24);
        ctx.lineTo(W / 2, H - 24);
        ctx.stroke();
        ctx.restore();
      } else {
        // Full 4x6 Postcard layout (1200x1800)
        drawSingleStripColumn(ctx, theme, loadedImgs, count, 20, 20, W - 40, H - 40, false);
      }

      const finalDataUrl = canvas.toDataURL('image/jpeg', 0.95);
      document.getElementById('composedPreviewImg').src = finalDataUrl;
      document.getElementById('printOnlyImg').src = finalDataUrl;
    }

    function createPlaceholderPhoto(theme) {
      const c = document.createElement('canvas');
      c.width = 900;
      c.height = 600;
      const ctx = c.getContext('2d');
      ctx.fillStyle = theme.borderColor;
      ctx.fillRect(0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', 0.8);
    }

    function loadImageElement(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function drawCoverFit(ctx, source, srcW, srcH, dx, dy, dw, dh) {
      if (!srcW || !srcH) return;
      const srcRatio = srcW / srcH;
      const dstRatio = dw / dh;
      let sx = 0;
      let sy = 0;
      let sw = srcW;
      let sh = srcH;

      if (srcRatio > dstRatio) {
        sw = srcH * dstRatio;
        sx = (srcW - sw) / 2;
      } else {
        sh = srcW / dstRatio;
        sy = (srcH - sh) / 2;
      }

      ctx.drawImage(source, sx, sy, sw, sh, dx, dy, dw, dh);
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function delayMs(ms, sessionToken) {
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve(sessionToken === STATE.sessionId);
        }, ms);
      });
    }

    /**
     * Direct print action for Canon SELPHY Wi-Fi / AirPrint (100mm x 148mm / 4x6 inch)
     */
    async function triggerDirectPrint() {
      await renderSelphyComposition();
      showStatusToast('جاري إرسال الصورة للطباعة • الاستلام من الكاشير');
      setTimeout(() => {
        try {
          window.print();
        } catch (err) {
          showStatusToast('يرجى استخدام خيار الطباعة من المتصفح • الاستلام من الكاشير');
        }
      }, 180);
    }

    /**
     * Reset cleanly back to Screen 1 (Start Kiosk)
     */
    async function resetToStartScreen() {
      STATE.sessionId += 1;
      STATE.isCaptureRunning = false;
      STATE.capturedPhotos = [];
      document.getElementById('countdownOverlay').classList.add('hidden');
      renderCapturedThumbnails();
      setActiveScreen('start');
      await ensureCameraAccess();
    }

    let toastTimeout = null;
    function showStatusToast(message) {
      const toast = document.getElementById('statusToast');
      const textEl = document.getElementById('statusToastText');
      textEl.textContent = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 3200);
    }

    /**
     * Initialize Kiosk on Load
     */
    window.addEventListener('DOMContentLoaded', async () => {
      installViewportLocks();
      startSimulatedCameraLoop();
      await selectTheme('kids');
      await ensureCameraAccess();
    });
  </script>
</body>
