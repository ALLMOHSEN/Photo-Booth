<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>فوتو بوث الذكريات | Canon SELPHY</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Arabic Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* Strict Kiosk Viewport & Touch Lock */
    html, body, #app {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: 'Cairo', sans-serif;
      background-color: #050814;
      color: #f8fafc;
    }

    button, [role="button"] {
      touch-action: manipulation;
      cursor: pointer;
      position: relative;
      z-index: 2;
      -webkit-tap-highlight-color: rgba(255, 255, 255, 0.14);
    }

    /* Blurred live camera background on home screen */
    .blurred-camera-bg {
      filter: blur(14px) brightness(0.74);
      transform: scale(1.08);
    }

    .blurred-camera-bg.mirrored {
      transform: scaleX(-1) scale(1.08);
    }

    /* Unblurred live camera feed during capture */
    .live-camera-feed {
      filter: blur(0px) brightness(1);
      transform: scale(1);
      transform-origin: center center;
      border-radius: 34px;
    }

    .live-camera-feed.mirrored {
      transform: scaleX(-1);
    }

    /* Framing guide overlay showing exact visible crop region in sharp clarity while surrounding area is blurred */
    #framingGuideOverlay {
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      overflow: hidden;
    }

    #framingGuideBackdrop {
      position: absolute;
      inset: 0;
      backdrop-filter: blur(15px) saturate(0.88) brightness(0.62);
      -webkit-backdrop-filter: blur(15px) saturate(0.88) brightness(0.62);
      background: rgba(2, 6, 23, 0.34);
      transition: clip-path 0.22s ease;
    }

    #framingGuideClearWindow {
      position: absolute;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 28px 12px rgba(2, 6, 23, 0.36), inset 0 0 26px rgba(255, 255, 255, 0.16), 0 16px 40px rgba(2, 6, 23, 0.42);
      transition: left 0.2s ease, top 0.2s ease, width 0.2s ease, height 0.2s ease, border-radius 0.2s ease;
    }

    #framingGuideClearVideo,
    #framingGuideClearCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      border-radius: 34px;
      transform-origin: center center;
    }

    #framingGuideClearVideo.mirrored,
    #framingGuideClearCanvas.mirrored {
      transform: scaleX(-1);
    }

    #framingGuideBadge {
      position: absolute;
      top: -36px;
      right: 0;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #f8fafc;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* Gentle central button pulse */
    @keyframes capturePulse {
      0%, 100% {
        box-shadow: 0 0 36px rgba(99, 102, 241, 0.55), 0 0 72px rgba(236, 72, 153, 0.28);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 52px rgba(99, 102, 241, 0.8), 0 0 95px rgba(236, 72, 153, 0.45);
        transform: scale(1.02);
      }
    }

    .capture-btn-pulse {
      animation: capturePulse 2.8s infinite ease-in-out;
    }

    /* White camera flash animation */
    @keyframes flashBurst {
      0% { opacity: 0.96; }
      100% { opacity: 0; }
    }

    .flash-burst {
      animation: flashBurst 0.42s ease-out forwards;
    }

    /* Countdown number entrance */
    @keyframes countPop {
      0% { transform: scale(0.45); opacity: 0; }
      35% { transform: scale(1.12); opacity: 1; }
      85% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.85); opacity: 0; }
    }

    .count-pop {
      animation: countPop 0.92s ease-in-out forwards;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* Print-only container hidden during normal kiosk viewing */
    #printOnlyContainer {
      display: none;
    }

    /* Canon SELPHY 4x6 inch / 100mm x 148mm borderless print rules */
    @page {
      size: 100mm 148mm;
      margin: 0;
    }

    @media print {
      @page {
        size: 100mm 148mm;
        margin: 0 !important;
      }

      html, body, #app {
        width: 100mm !important;
        height: 148mm !important;
        min-height: 148mm !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        background: #ffffff !important;
      }

      #app > *:not(#printOnlyContainer) {
        display: none !important;
      }

      #printOnlyContainer {
        display: block !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100mm !important;
        height: 148mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        z-index: 999999 !important;
      }

      #printOnlyImg {
        width: 100mm !important;
        height: 148mm !important;
        max-width: none !important;
        max-height: none !important;
        object-fit: fill !important;
        display: block !important;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="relative w-full h-full overflow-hidden">

    <!-- Full-screen flash overlay on photo capture -->
    <div id="flashOverlay" class="fixed inset-0 bg-white pointer-events-none opacity-0 z-50"></div>

    <!-- Non-intrusive Camera Status Pill & Diagnostic Modal (shown only when fallback/issue occurs) -->
    <div id="cameraStatusBadge" class="hidden fixed top-3 left-3 z-40 max-w-[82vw]">
      <button
        id="btnOpenCameraDiag"
        type="button"
        onclick="openCameraDiagnostics(true)"
        class="px-3 py-1.5 rounded-2xl bg-amber-950/90 hover:bg-amber-900 border border-amber-300/50 text-amber-100 text-xs font-extrabold shadow-lg flex items-center gap-2"
      >
        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 shrink-0"></span>
        <span id="cameraStatusBadgeText">وضع المعاينة الافتراضية — اضغط للتشخيص</span>
      </button>
    </div>

    <div id="cameraDiagModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
      <div class="w-full max-w-lg glass-panel rounded-3xl p-5 sm:p-6 border border-white/20 shadow-2xl flex flex-col gap-4 text-right">
        <div class="flex items-center justify-between gap-2 border-b border-white/10 pb-3">
          <h3 class="text-lg sm:text-xl font-black text-white">تشخيص الكاميرا وإعادة التشغيل</h3>
          <button
            type="button"
            onclick="closeCameraDiagnostics()"
            class="px-3 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-bold"
          >
            إغلاق
          </button>
        </div>

        <div class="bg-slate-950/75 rounded-2xl p-3.5 border border-white/10 flex flex-col gap-1.5">
          <div id="diagErrorCode" class="text-xs font-black text-amber-300">حالة الكاميرا</div>
          <p id="diagExplanation" class="text-sm font-bold text-slate-100 leading-relaxed"></p>
          <p id="diagSuggestion" class="text-xs font-semibold text-slate-300 leading-relaxed"></p>
        </div>

        <div class="flex flex-wrap items-center gap-2.5">
          <button
            type="button"
            onclick="initCamera(true)"
            class="flex-1 min-w-[160px] py-3 px-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-black text-sm shadow-lg transition"
          >
            إعادة تشغيل الكاميرا
          </button>
          <button
            type="button"
            onclick="toggleFacingModeAndRestart()"
            class="py-3 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-white/15 text-slate-100 font-extrabold text-sm transition"
          >
            تبديل الكاميرا (أمامية / خلفية)
          </button>
        </div>
      </div>
    </div>

    <!-- Print-only full-bleed 100mm x 148mm (4in x 6in) output -->
    <div id="printOnlyContainer" aria-hidden="true">
      <img id="printOnlyImg" alt="Canon SELPHY 100mm x 148mm Print" />
    </div>

    <!-- ===================================================================== -->
    <!-- SCREEN 1: START SCREEN (BLURRED BG + SEPARATE 3/4 + STRIP/FULL + BTN) -->
    <!-- ===================================================================== -->
    <section id="homeScreen" class="relative w-full h-full flex items-center justify-center p-6 overflow-hidden">
      <!-- Blurred Camera Background (<video> with automatic fallback to smooth animated canvas) -->
      <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <video id="bgVideo" autoplay playsinline webkit-playsinline="true" muted class="w-full h-full object-cover blurred-camera-bg mirrored hidden"></video>
        <canvas id="bgSimCanvas" width="1280" height="720" class="w-full h-full object-cover blurred-camera-bg"></canvas>
        <div class="fixed inset-0 bg-slate-950/35"></div>
      </div>

      <!-- Center Stack: Separate 3/4 Shot Buttons + Separate Dual Strip / Full Frame Buttons + Capture Button -->
      <div class="relative z-10 w-full max-w-md flex flex-col items-center justify-center gap-3">
        <!-- Separate 3 or 4 Shots Picker -->
        <div class="w-full grid grid-cols-2 gap-3 glass-panel p-2 rounded-3xl" role="group" aria-label="عدد الصور">
          <button
            id="btnShots3"
            type="button"
            data-action="select-shots"
            data-shots="3"
            class="shot-count-btn py-2.5 px-3 rounded-2xl border-2 flex items-center justify-center gap-2.5 transition bg-indigo-600/45 border-amber-300 text-white shadow"
          >
            <svg class="w-5 h-5 shrink-0 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <rect x="4" y="3" width="16" height="5" rx="1.5" />
              <rect x="4" y="9.5" width="16" height="5" rx="1.5" />
              <rect x="4" y="16" width="16" height="5" rx="1.5" />
            </svg>
            <span class="text-base sm:text-lg font-black">3 صور</span>
          </button>

          <button
            id="btnShots4"
            type="button"
            data-action="select-shots"
            data-shots="4"
            class="shot-count-btn py-2.5 px-3 rounded-2xl border-2 flex items-center justify-center gap-2.5 transition bg-slate-900/70 border-white/15 text-slate-200 hover:border-white/35"
          >
            <svg class="w-5 h-5 shrink-0 text-sky-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5" />
              <rect x="13" y="3.5" width="7.5" height="7.5" rx="1.5" />
              <rect x="3.5" y="13" width="7.5" height="7.5" rx="1.5" />
              <rect x="13" y="13" width="7.5" height="7.5" rx="1.5" />
            </svg>
            <span class="text-base sm:text-lg font-black">4 صور</span>
          </button>
        </div>

        <!-- Separate Dual Strip (شريطين) or Full Frame (كاملة) Picker — Home Screen Only -->
        <div class="w-full grid grid-cols-2 gap-3 glass-panel p-2 rounded-3xl" role="group" aria-label="نوع الإطار">
          <button
            id="btnStartDualStrip"
            type="button"
            data-action="select-layout"
            data-layout="dual_strip"
            class="home-layout-btn py-2.5 px-3 rounded-2xl border-2 flex items-center justify-center gap-2.5 transition bg-indigo-600/45 border-amber-300 text-white shadow"
          >
            <svg class="w-5 h-5 shrink-0 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <rect x="3.5" y="3.5" width="7" height="17" rx="1.5" />
              <rect x="13.5" y="3.5" width="7" height="17" rx="1.5" />
            </svg>
            <span class="text-sm sm:text-base font-black">شريطين</span>
          </button>

          <button
            id="btnStartFullFrame"
            type="button"
            data-action="select-layout"
            data-layout="postcard"
            class="home-layout-btn py-2.5 px-3 rounded-2xl border-2 flex items-center justify-center gap-2.5 transition bg-slate-900/70 border-white/15 text-slate-200 hover:border-white/35"
          >
            <svg class="w-5 h-5 shrink-0 text-pink-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <rect x="3.5" y="3.5" width="17" height="17" rx="2.5" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 15l3-3 2.5 2.5 3.5-4 1.5 1.5" />
            </svg>
            <span class="text-sm sm:text-base font-black">كاملة</span>
          </button>
        </div>

        <!-- Single Centered Capture Button with Price -->
        <button
          id="startCaptureBtn"
          type="button"
          data-action="start-capture"
          class="capture-btn-pulse w-full px-8 py-9 sm:px-10 sm:py-10 rounded-[2.25rem] bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:via-purple-500 hover:to-pink-500 active:scale-95 text-white border-2 border-white/25 transition-all duration-200 flex flex-col items-center justify-center gap-3"
        >
          <svg class="w-12 h-12 sm:w-14 sm:h-14 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <circle cx="12" cy="13" r="3.5" />
          </svg>
          <span id="startCaptureBtnLabel" class="text-2xl sm:text-3xl font-black tracking-tight text-center leading-snug">
            أخذ صورة ذكرى بسعر 5,000 د.ع
          </span>
        </button>
      </div>
    </section>

    <!-- ===================================================================== -->
    <!-- SCREEN 2: FULL-SCREEN UNBLURRED CAPTURE (6s INITIAL -> 3s BETWEEN)   -->
    <!-- ===================================================================== -->
    <section id="captureScreen" class="hidden relative w-full h-full flex items-center justify-center bg-black overflow-hidden">
      <video id="liveVideo" autoplay playsinline webkit-playsinline="true" muted class="w-full h-full object-cover live-camera-feed mirrored hidden"></video>
      <canvas id="liveSimCanvas" width="1280" height="720" class="w-full h-full object-cover live-camera-feed mirrored hidden"></canvas>

      <!-- Transparent crop-guide window: keeps exact final frame sharp while dimming/blurring outer area -->
      <div id="framingGuideOverlay" aria-hidden="true">
        <div id="framingGuideBackdrop"></div>
        <div id="framingGuideClearWindow">
          <video id="framingGuideClearVideo" autoplay playsinline webkit-playsinline="true" muted class="hidden"></video>
          <canvas id="framingGuideClearCanvas" width="1280" height="720" class="hidden"></canvas>
          <div id="framingGuideBadge">الجزء الذي سيظهر بالإطار</div>
        </div>
      </div>

      <!-- Shot progress indicator (1 / 3, 2 / 3, 3 / 3) -->
      <div class="fixed top-4 right-4 z-20 pointer-events-none">
        <div id="captureShotCounter" class="px-4 py-2 rounded-2xl bg-slate-950/75 border border-white/20 text-sm sm:text-base font-black text-white shadow-lg">
          1 / 3
        </div>
      </div>

      <!-- Countdown Overlay -->
      <div id="countdownOverlay" class="hidden fixed inset-0 z-20 flex flex-col items-center justify-center pointer-events-none bg-black/20">
        <div id="countdownNumber" class="count-pop text-8xl sm:text-[9rem] font-black text-white drop-shadow-[0_10px_35px_rgba(0,0,0,0.85)] leading-none">
          6
        </div>
      </div>
    </section>

    <!-- ===================================================================== -->
    <!-- SCREEN 3: THEMES + DIRECT PRINT (NO STRIP/FULL BUTTONS AFTER CAPTURE) -->
    <!-- ===================================================================== -->
    <section id="editorScreen" class="hidden relative w-full h-full p-3 sm:p-5 lg:p-6 flex flex-col lg:flex-row gap-4 lg:gap-6 items-stretch justify-center overflow-hidden">
      <!-- Left / Top Preview Column: 4x6 Canon SELPHY Composition -->
      <div class="lg:w-1/2 h-[42%] lg:h-full glass-panel rounded-3xl p-3 sm:p-5 flex items-center justify-center relative overflow-hidden">
        <img
          id="composedPreviewImg"
          alt="معاينة الصورة النهائية"
          class="max-h-full w-auto rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.85)] border-2 border-white/20 object-contain"
        />
      </div>

      <!-- Controls Column: One-Tap Themes + Direct Print -->
      <div class="lg:w-1/2 h-[58%] lg:h-full glass-panel rounded-3xl p-3.5 sm:p-5 lg:p-6 flex flex-col justify-between gap-2.5 overflow-hidden">
        <div class="flex flex-col gap-2.5 overflow-y-auto pr-0.5">
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-base sm:text-xl font-black text-white">الثيم</h2>
            <span id="editorModeBadge" class="px-3 py-1 rounded-xl bg-slate-900/90 border border-white/15 text-xs sm:text-sm font-black text-amber-300">
              3 صور • شريطين
            </span>
          </div>

          <!-- Simple One-Tap Themes Grid -->
          <div id="themesGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2">
            <button
              type="button"
              data-action="select-theme"
              data-theme="kids"
              class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-amber-500/25 border-amber-300 text-white shadow"
            >
              <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-amber-300 to-sky-400"></span>
              <span class="text-xs sm:text-sm font-black leading-tight">أطفال</span>
            </button>

            <button
              type="button"
              data-action="select-theme"
              data-theme="girls"
              class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-pink-400/60 text-slate-200"
            >
              <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-pink-400 to-rose-500"></span>
              <span class="text-xs sm:text-sm font-black leading-tight">بنات</span>
            </button>

            <button
              type="button"
              data-action="select-theme"
              data-theme="boys"
              class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-cyan-400/60 text-slate-200"
            >
              <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-cyan-400 to-blue-600"></span>
              <span class="text-xs sm:text-sm font-black leading-tight">أولاد</span>
            </button>

            <button
              type="button"
              data-action="select-theme"
              data-theme="adults"
              class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-yellow-400/60 text-slate-200"
            >
              <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-neutral-900 to-amber-500"></span>
              <span class="text-xs sm:text-sm font-black leading-tight">كبار</span>
            </button>

            <button
              type="button"
              data-action="select-theme"
              data-theme="royal_white"
              class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-amber-200/70 text-slate-200"
            >
              <span class="w-5 h-5 rounded-full shrink-0 border border-slate-400 bg-gradient-to-br from-white to-amber-200"></span>
              <span class="text-xs sm:text-sm font-black leading-tight">أبيض ملكي</span>
            </button>

            <button
              type="button"
              data-action="select-theme"
              data-theme="pastel"
              class="theme-pill-btn p-2.5 sm:p-3 rounded-2xl border-2 text-right transition flex items-center gap-2.5 bg-slate-900/75 border-white/15 hover:border-teal-300/60 text-slate-200"
            >
              <span class="w-5 h-5 rounded-full shrink-0 border border-white/40 bg-gradient-to-br from-emerald-200 via-purple-200 to-rose-200"></span>
              <span class="text-xs sm:text-sm font-black leading-tight">باستيل</span>
            </button>
          </div>
        </div>

        <!-- Primary Print & Reset Actions -->
        <div class="flex flex-col gap-2 pt-2 border-t border-white/10 shrink-0">
          <div class="w-full flex items-center justify-between gap-3 bg-slate-900/85 border border-white/15 rounded-2xl px-3.5 py-2">
            <div class="flex flex-col text-right">
              <span class="text-xs font-bold text-slate-300">عدد الطبعات (5,000 د.ع للطبعة)</span>
              <span id="printTotalPriceLabel" class="text-sm sm:text-base font-black text-amber-300">المجموع: 5,000 د.ع</span>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              <button
                id="btnDecCopies"
                type="button"
                data-action="change-copies"
                data-delta="-1"
                aria-label="تقليل عدد الطبعات"
                class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 border border-white/15 text-white font-black text-lg flex items-center justify-center transition"
              >
                -
              </button>
              <span id="printCopiesValue" class="min-w-[2rem] text-center text-base sm:text-lg font-black text-white">1</span>
              <button
                id="btnIncCopies"
                type="button"
                data-action="change-copies"
                data-delta="1"
                aria-label="زيادة عدد الطبعات"
                class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 border border-white/15 text-white font-black text-lg flex items-center justify-center transition"
              >
                +
              </button>
            </div>
          </div>

          <button
            id="btnOpenFullScreenPreview"
            type="button"
            data-action="open-fullscreen-preview"

    function syncHomeSelectionButtons() {
